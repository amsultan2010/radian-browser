    <linearGradient id="spectrum-sw" x1="230" y1="420" x2="810" y2="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1FB6FF"/><stop offset="0.5" stop-color="#3D7BFF"/><stop offset="0.8" stop-color="#2FD3B5"/><stop offset="1" stop-color="#7AE582"/></linearGradient>
  </defs>
