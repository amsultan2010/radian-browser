    <linearGradient id="sheen" x1="160" y1="924" x2="864" y2="100" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.3" stop-color="#fff" stop-opacity="0.65"/><stop offset="0.36" stop-color="#fff" stop-opacity="0"/><stop offset="0.62" stop-color="#fff" stop-opacity="0"/><stop offset="0.7" stop-color="#fff" stop-opacity="0.5"/><stop offset="0.78" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="streaks" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse"><stop offset="0.12" stop-color="#fff" stop-opacity="0"/><stop offset="0.16" stop-color="#fff" stop-opacity="0.55"/><stop offset="0.19" stop-color="#fff" stop-opacity="0"/><stop offset="0.82" stop-color="#fff" stop-opacity="0"/><stop offset="0.86" stop-color="#fff" stop-opacity="0.6"/><stop offset="0.9" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <!-- The R and the swoosh run the spectrum in opposite directions, so the colours shift where they cross. -->
