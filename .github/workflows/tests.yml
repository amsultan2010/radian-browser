# Radian's tests on macOS, on every push. Screenshots taken by the end-to-end
# tests are uploaded as artifacts of the run.
name: Tests

on:
  push:
  workflow_dispatch:

jobs:
  tests:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ad blocker
        run: node tests/adblock.test.js

      - name: Command Bar learning
        run: node tests/suggest.test.js

      - name: Extensions
        run: node --test tests/extensions.test.js

      - name: App icons
        run: node --test tests/app-icon.test.js

      - name: Tab sleep rules
        run: node tests/veille.test.js

      - name: Site search and link routing rules
        run: node tests/liens.test.js

      - name: Notification click hook
        run: node tests/notifications.test.js

      - name: Screenshot folder
        run: |
          mkdir -p "$RUNNER_TEMP/captures"
          echo "ORBE_SHOTS=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"

      - name: End-to-end tests
        run: node scripts/dev.js --selftest

      # Extension API layer, in the real browser, without the network.
      - name: Extensions in the browser
        run: node scripts/test-ext.js

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-macos
          path: ${{ runner.temp }}/captures
          if-no-files-found: ignore
