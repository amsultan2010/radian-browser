# Builds Radian.app on Apple Silicon and publishes the DMG and the zip to a
# GitHub Release when a version tag (vX.Y.Z) is pushed. A manual run builds the
# same files and keeps them as workflow artifacts, without publishing.
#
# Signing and notarization happen only when the optional secrets are set:
#   MACOS_CERTIFICATE           base64 of a "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  its password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD  for notarytool
# Without them the build is ad hoc signed, like a local `npm run dist`.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: macOS (Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json $version"; exit 1; fi

      - name: Signing certificate and notary profile
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/radian.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12 -k "$keychain"
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain
          security default-keychain -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          if [ -z "$identity" ]; then echo "No Developer ID Application identity in the certificate"; exit 1; fi
          echo "RADIAN_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then
            xcrun notarytool store-credentials radian --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo "RADIAN_NOTARY_PROFILE=radian" >> "$GITHUB_ENV"
          fi

      - name: Build Radian.app, the DMG and the zip
        run: npm run dist

      - name: Keep the files (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Radian-mac-arm64
          path: |
            ~/.orbe-dev/dist/Radian-*.dmg
            ~/.orbe-dev/dist/Radian-*.zip
          compression-level: 0

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ~/.orbe-dev/dist/Radian-*.dmg ~/.orbe-dev/dist/Radian-*.zip \
            --title "Radian ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
