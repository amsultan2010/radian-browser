<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
<title>Radian</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <!-- Un seul tracé par icône quand c’est possible : la couleur est translucide, deux tracés qui se
       croisent s’additionneraient (plus clair aux jonctions). -->
  <!-- Barre du haut et rangée du bas : dessinés sur 20 × 20 (svg.i.tb), à la taille de l'encre relevée dans Arc
       (flèches 15 × 12, actualiser 14 × 17, barre latérale 18,5 × 14,5, « + » 14 × 14, Bibliothèque 13,5 × 16,5). -->
  <symbol id="i-back" viewBox="0 0 20 20"><path d="M16.75 10H3.25M8.5 4.75 3.25 10l5.25 5.25"/></symbol>
  <symbol id="i-forward" viewBox="0 0 20 20"><path d="M3.25 10h13.5M11.5 4.75 16.75 10l-5.25 5.25"/></symbol>
  <symbol id="i-reload" viewBox="0 0 20 20"><path d="M10 4.75a6.25 6.25 0 1 0 5.41 3.13M8 1.75 11 4.75 8 7.75"/></symbol>
  <symbol id="i-stop" viewBox="0 0 20 20"><path d="m5.5 5.5 9 9m0-9-9 9"/></symbol>
  <symbol id="i-sidebar" viewBox="0 0 20 20"><path d="M4.75 3.5h10.5a3.25 3.25 0 0 1 3.25 3.25v6.5a3.25 3.25 0 0 1-3.25 3.25H4.75a3.25 3.25 0 0 1-3.25-3.25v-6.5A3.25 3.25 0 0 1 4.75 3.5zM7.6 3.5v13"/><path d="M3.85 6.9h1.3M3.85 8.9h1.3M3.85 10.9h1.3" stroke-width="1.2"/></symbol>
  <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 3.75v12.5M3.75 10h12.5"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m4.8 4.8 6.4 6.4m0-6.4-6.4 6.4"/></symbol>
  <!-- Fermer (onglet du jour) et décharger (onglet épinglé), au survol d'une ligne : encre 10 × 10. -->
  <symbol id="i-close" viewBox="0 0 16 16"><path d="m3.75 3.75 8.5 8.5m0-8.5-8.5 8.5"/></symbol>
  <symbol id="i-minus" viewBox="0 0 16 16"><path d="M3.75 8h8.5"/></symbol>
  <symbol id="i-library" viewBox="0 0 20 20"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M6.5 9.25h7.85a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2zM9.4 10.4h2.1a.9.9 0 0 1 0 1.8H9.4a.9.9 0 0 1 0-1.8z"/><path fill="currentColor" stroke="none" d="M6.6 2.5c.35 1.45 1.2 2.25 3.2 2.8-2 .5-2.85 1.3-3.2 2.75-.35-1.45-1.2-2.25-3.2-2.75 2-.55 2.85-1.35 3.2-2.8z"/><circle cx="12.4" cy="2.6" r=".9" fill="currentColor" stroke="none"/><path fill="currentColor" stroke="none" d="M13.6 3.7 17 5.85 13.6 8z"/></symbol>
  <!-- Dossier plein, à la couleur de l'Espace, liseré clair (encre 19 × 18,5 dans Arc). -->
  <symbol id="i-folder" viewBox="0 0 20 20"><path style="fill:currentColor;stroke:var(--folder-line)" d="M1.25 4.25A2.75 2.75 0 0 1 4 1.5h4.6a2 2 0 0 1 1.5.7l1 1.2H16a2.75 2.75 0 0 1 2.75 2.75v10.1A2.25 2.25 0 0 1 16.5 18.5h-13a2.25 2.25 0 0 1-2.25-2.25z"/><path style="stroke:var(--folder-line)" d="M1.25 5.5h17.5"/></symbol>
  <symbol id="i-star" viewBox="0 0 20 20"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 0a10 10 0 1 1 0 20 10 10 0 0 1 0-20zM10 5.75 11.2 8.69 14.37 8.93 11.95 10.98 12.7 14.07 10 12.4 7.3 14.07 8.05 10.98 5.63 8.93 8.8 8.69z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16"><path d="m6 4 4 4-4 4"/></symbol>
  <symbol id="i-sound" viewBox="0 0 16 16"><path d="M3 6.4h2L7.8 4v8L5 9.6H3z"/><path d="M10.2 6.2a2.6 2.6 0 0 1 0 3.6M11.9 4.6a5 5 0 0 1 0 6.8"/></symbol>
  <symbol id="i-mute" viewBox="0 0 16 16"><path d="M3 6.4h2L7.8 4v8L5 9.6H3z"/><path d="m10.5 6.3 3 3.4m0-3.4-3 3.4"/></symbol>
  <symbol id="i-play" viewBox="0 0 16 16"><path d="M5.5 3.8v8.4L12 8z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 16 16"><path d="M5.6 4v8M10.4 4v8" stroke-width="2.2"/></symbol>
  <symbol id="i-prev" viewBox="0 0 16 16"><path d="M12 4v8L6.2 8z" fill="currentColor"/><path d="M4.4 4v8" stroke-width="2"/></symbol>
  <symbol id="i-pip" viewBox="0 0 16 16"><rect x="2" y="3.2" width="12" height="9.6" rx="1.8"/><rect x="8.2" y="8" width="4" height="3" rx=".8" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-next" viewBox="0 0 16 16"><path d="M4 4v8l5.8-4z" fill="currentColor"/><path d="M11.6 4v8" stroke-width="2"/></symbol>
  <symbol id="i-back15" viewBox="0 0 16 16"><path d="M3.4 8a4.6 4.6 0 1 0 1.5-3.4"/><path d="M3.2 2.6v2.6h2.6"/><path d="M6.6 6.9l1-.6v3.6M9.9 6.4H8.8v1.4c.9-.3 1.4.1 1.4.9 0 .9-.9 1.3-1.6.9" stroke-width="1.1"/></symbol>
  <symbol id="i-fwd15" viewBox="0 0 16 16"><path d="M12.6 8a4.6 4.6 0 1 1-1.5-3.4"/><path d="M12.8 2.6v2.6h-2.6"/><path d="M6.1 6.9l1-.6v3.6M9.4 6.4H8.3v1.4c.9-.3 1.4.1 1.4.9 0 .9-.9 1.3-1.6.9" stroke-width="1.1"/></symbol>
  <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 2.2 3.4 3.9v3.6c0 2.9 1.9 5.2 4.6 6.3 2.7-1.1 4.6-3.4 4.6-6.3V3.9z"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7.5" cy="7.5" r="4.75"/><path d="m11 11 2.25 2.25"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.4"/></symbol>
  <symbol id="i-reset" viewBox="0 0 16 16"><path d="M4 8h8M4 8l3-3M4 8l3 3"/></symbol>
  <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.6 14 13H2z"/><path d="M8 6.6v3M8 11.3h.01"/></symbol>
  <symbol id="i-popup" viewBox="0 0 16 16"><rect x="2.4" y="3" width="11.2" height="10" rx="2"/><path d="M2.4 6h11.2M6.2 8.4l3.6 3.2m0-3.2-3.6 3.2"/></symbol>
  <symbol id="i-screen" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="8" rx="1.6"/><path d="M6 13.4h4M8 11v2.4"/></symbol>
  <symbol id="i-camera" viewBox="0 0 16 16"><rect x="1.8" y="4.4" width="8.6" height="7.2" rx="1.6"/><path d="m10.4 7 3.8-2v6l-3.8-2"/></symbol>
  <symbol id="i-link" viewBox="0 0 16 16"><path d="M6.9 9.1a2.7 2.7 0 0 0 3.8 0l1.9-1.9a2.7 2.7 0 0 0-3.8-3.8l-.7.7"/><path d="M9.1 6.9a2.7 2.7 0 0 0-3.8 0L3.4 8.8a2.7 2.7 0 0 0 3.8 3.8l.7-.7"/></symbol>
  <symbol id="i-quote" viewBox="0 0 16 16"><path d="M3.6 2.8h8.8a1.8 1.8 0 0 1 1.8 1.8v5a1.8 1.8 0 0 1-1.8 1.8H8.6l-3.2 2.4v-2.4H3.6a1.8 1.8 0 0 1-1.8-1.8v-5a1.8 1.8 0 0 1 1.8-1.8z"/><path d="M6.6 5.9 6 7.7M9.9 5.9 9.3 7.7"/></symbol>
  <symbol id="i-microphone" viewBox="0 0 16 16"><rect x="6" y="2.2" width="4" height="7" rx="2"/><path d="M3.8 7.6a4.2 4.2 0 0 0 8.4 0M8 11.8v2"/></symbol>
  <!-- Developer Mode bar: photo camera, console, network (globe), element picker (crosshair). -->
  <symbol id="i-photo" viewBox="0 0 16 16"><path d="M3.75 4.5h1.6l1-1.75h3.3l1 1.75h1.6a2 2 0 0 1 2 2v4.75a2 2 0 0 1-2 2h-8.5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2z"/><circle cx="8" cy="8.6" r="2.4"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 16 16"><path d="M3.5 2.75h9a1.75 1.75 0 0 1 1.75 1.75v7a1.75 1.75 0 0 1-1.75 1.75h-9a1.75 1.75 0 0 1-1.75-1.75v-7A1.75 1.75 0 0 1 3.5 2.75z"/><path d="m4.75 6.25 2 1.75-2 1.75M8.25 10h3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.25"/><path d="M8 1.75c-1.9 1.7-2.75 3.8-2.75 6.25S6.1 12.55 8 14.25c1.9-1.7 2.75-3.8 2.75-6.25S9.9 3.45 8 1.75zM1.75 8h12.5"/></symbol>
  <symbol id="i-scope" viewBox="0 0 16 16"><circle cx="8" cy="8" r="4.75"/><path d="M8 1.5v1.75M8 12.75v1.75M1.5 8h1.75M12.75 8h1.75M8 8h.01"/></symbol>
  <symbol id="i-microphone-off" viewBox="0 0 16 16"><rect x="6" y="2.2" width="4" height="7" rx="2"/><path d="M3.8 7.6a4.2 4.2 0 0 0 8.4 0M8 11.8v2M2.6 2.4l10.8 11.2"/></symbol>
  <symbol id="i-share-tab" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="9.4" rx="1.6"/><circle cx="8" cy="6.6" r="1.4"/><path d="M5.5 10.6a2.5 2.5 0 0 1 5 0"/></symbol>
  <symbol id="i-camera-off" viewBox="0 0 16 16"><rect x="1.8" y="4.4" width="8.6" height="7.2" rx="1.6"/><path d="m10.4 7 3.8-2v6l-3.8-2M2 2.4l12 11.2"/></symbol>
</svg>

<div id="tint"></div>
<!-- Ombre de la carte (la page est une vue native posée par-dessus) ; fenêtre à l'arrière-plan, son
     ombre étendue assombrit tout le cadre autour de la carte (comme dans Arc). -->
<div id="card"></div>
<aside id="sidebar">
  <div id="top">
    <button class="ib" id="b-sidebar" data-tip="side.hideSidebar" data-tip-key="toggleSidebar"><svg class="i tb"><use href="#i-sidebar"/></svg></button>
    <span class="grow drag"></span>
    <button class="ib" id="b-back" data-tip="side.back" data-tip-key="back"><svg class="i tb"><use href="#i-back"/></svg></button>
    <button class="ib" id="b-forward" data-tip="side.forward" data-tip-key="forward"><svg class="i tb"><use href="#i-forward"/></svg></button>
    <button class="ib" id="b-reload"><svg class="i tb"><use id="reload-icon" href="#i-reload"/></svg></button>
  </div>
  <div id="url-row">
    <button id="lock" hidden><svg class="i"><use href="#i-warn"/></svg><span id="lock-text"></span></button>
    <button id="url"><svg class="i" id="url-search"><use href="#i-search"/></svg><span id="url-text"></span></button>
    <div id="exts"></div>
    <button id="url-copy" data-tip="side.copyLink" data-tip-key="copyUrl" hidden><svg class="i"><use href="#i-link"/></svg></button>
    <button id="popup-note" class="note" hidden><svg class="i"><use href="#i-popup"/></svg></button>
    <button id="capture-note" class="note" hidden><svg class="i"><use id="capture-icon" href="#i-screen"/></svg></button>
    <button id="shield" data-t-title="adblock.title"><svg class="i"><use href="#i-shield"/></svg><span id="shield-n"></span></button>
    <button id="quote-note" class="note" data-tip="side.shareQuote" data-tip-key="copyUrlQuote" hidden><svg class="i"><use href="#i-quote"/></svg></button>
  </div>
  <div id="fav" data-drop="favorites"></div>
  <!-- Favoris vides : l'invitation d'Arc (cadre en tirets), jusqu'à ce qu'on la ferme. -->
  <div id="fav-hint" hidden>
    <svg class="fh-box"><rect/></svg>
    <svg class="i fh-star"><use href="#i-star"/></svg>
    <b data-t="side.favEmptyTitle"></b>
    <span data-t="side.favEmptyBody"></span>
    <button id="fav-hint-close" data-t-title="popup.dismiss"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div id="pager">
  <div id="scroll">
    <div id="space-head">
      <span id="space-icon"></span>
      <span id="space-name" class="grow"></span>
      <button class="hb" id="space-more" data-t-title="side.spaceMore"><svg class="i"><use href="#i-more"/></svg></button>
      <button class="hb" id="pinned-toggle" data-t-title="side.collapsePinned"><svg class="i"><use href="#i-chevron"/></svg></button>
    </div>
    <div id="pinned" class="list" data-drop="pinned"></div>
    <div id="divider">
      <span class="rule"></span>
      <button id="b-clear" data-t="side.clear" data-tip="tabs.clearToday" data-tip-key="clearToday"></button>
    </div>
    <button id="b-newtab" class="row"><span class="ic"><svg class="i"><use href="#i-plus"/></svg></span><span class="title" data-t="side.newTab"></span><kbd data-key="newTab" aria-hidden="true"></kbd></button>
    <div id="today" class="list" data-drop="today"></div>
    <div id="blank"></div>
  </div>
  <button id="off-view" data-t-title="side.offView" hidden><svg class="i"><use href="#i-chevron"/></svg></button>
  </div>
  <div id="media" hidden></div>
  <div id="dls" hidden></div>
  <div id="update-note" hidden><button id="update-open"></button><button class="ib" id="update-close" data-t-title="update.later">×</button></div>
  <button id="trace-note" hidden><i></i><span data-t="trace.note"></span></button>
  <div id="incognito"><b data-t="incognito.title"></b><span data-t="incognito.body"></span></div>
  <div id="blank-note"><b data-t="blank.title"></b><span data-t="blank.body"></span></div>
  <div id="bottom">
    <button class="ib" id="b-library" data-tip="side.library" data-tip-key="library">
      <svg class="i tb"><use href="#i-library"/></svg>
      <svg id="dl-ring" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12"/></svg>
    </button>
    <div id="spaces" class="grow"></div>
    <button class="ib" id="b-plus" data-tip="side.plus"><svg class="i tb"><use href="#i-plus"/></svg></button>
  </div>
  <div id="resize"></div>
</aside>

<div id="toolbar">
  <button class="ib" id="tb-back"><svg class="i tb"><use href="#i-back"/></svg></button>
  <button class="ib" id="tb-forward"><svg class="i tb"><use href="#i-forward"/></svg></button>
  <button class="ib" id="tb-reload"><svg class="i tb"><use href="#i-reload"/></svg></button>
  <button id="tb-url"><svg class="i"><use href="#i-search"/></svg><span id="tb-url-text"></span></button>
  <!-- Developer Mode (Arc): copy, Portrait capture | console, network, element picker. -->
  <div id="tb-dev">
    <button class="ib" data-cmd="copyUrl" data-t-title="side.copyLink"><svg class="i"><use href="#i-link"/></svg></button>
    <button class="ib" data-cmd="capturePortrait" data-t-title="file.capturePortrait"><svg class="i"><use href="#i-photo"/></svg></button>
    <i class="tb-sep"></i>
    <button class="ib" data-cmd="console" data-t-title="view.console"><svg class="i"><use href="#i-terminal"/></svg></button>
    <button class="ib" data-cmd="network" data-t-title="view.network"><svg class="i"><use href="#i-globe"/></svg></button>
    <button class="ib" data-cmd="inspect" data-t-title="view.inspect"><svg class="i"><use href="#i-scope"/></svg></button>
  </div>
  <div id="tb-exts"></div>
</div>

<div id="empty"><div class="mark"></div><p data-t="side.empty"></p></div>
<div id="page-drag"></div>
<div id="glow"><i></i></div>
<div id="pane-ring"></div>
<div id="pane-bars"></div>
<div id="dividers"></div>
<div id="drop-line"></div>
<div id="tip" role="tooltip" hidden><span id="tip-text"></span><kbd id="tip-key"></kbd></div>

<!-- Scripts différés : placés en fin de page, ils s'exécutent au même moment et dans le même
     ordre que sans « defer », mais ils sont demandés tous ensemble au lieu d'un par un, chacun
     attendant la fin du précédent (DEM-13). -->
<script src="common.js" defer></script>
<script src="theme.js" defer></script>
<script src="players.js" defer></script>
<script src="fx.js" defer></script>
<script src="shell.js" defer></script>
<script src="libpeek.js" defer></script>
<script src="folderpeek.js" defer></script>
</body>
</html>
