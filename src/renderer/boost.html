<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Boost</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
html, body { background: transparent; overflow: hidden; }
body { background: color-mix(in srgb, var(--base) 86%, transparent); display: flex; flex-direction: column; height: 100vh; }
#drag { height: 38px; -webkit-app-region: drag; flex: none; }
main { padding: 0 16px 14px; flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; max-width: none; margin: 0; overflow-y: auto; }
main > * { flex: none; }
h1 { font-size: 16px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
h2 { margin: 8px 0 0; }
textarea { min-height: 110px; resize: vertical; border: 0; outline: 0; border-radius: 10px; background: var(--pill); color: var(--fg); padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; user-select: text; flex: none; }
#name { height: 28px; border: 0; outline: 0; border-radius: 8px; background: var(--pill); color: var(--fg); padding: 0 10px; user-select: text; }
#zaps { display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow: auto; }
.zap { display: flex; gap: 8px; align-items: center; font: 11px ui-monospace, Menlo, monospace; color: var(--dim); }
.zap span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowb { display: flex; gap: 8px; align-items: center; }
.rowb > .grow { flex: 1; min-width: 0; }
.rowb label { flex: none; width: 92px; color: var(--dim); font-size: 12px; }
.rowb output { flex: none; width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 12px; }
input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
#swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.dot { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px var(--line); flex: none; }
.dot.on { outline: 2px solid var(--accent); outline-offset: 2px; }
.dot.none { background: linear-gradient(135deg, transparent 45%, #f43f5e 45% 55%, transparent 55%), var(--pill); }
.hint { color: var(--dim); font-size: 12px; line-height: 1.4; }
.hint.warn { color: #e11d48; }
#foot { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
#list-items { display: flex; flex-direction: column; }
.item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 0.5px solid var(--line); }
.item:first-child { border-top: 0; }
.item .grow { flex: 1; min-width: 0; }
.item .site { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .what { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .what { color: var(--dim); }
#review { position: fixed; inset: 38px 0 0 0; z-index: 5; background: var(--base); padding: 0 16px 14px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
#review pre { margin: 0; max-height: 170px; overflow: auto; border-radius: 10px; background: var(--pill); color: var(--fg); padding: 10px; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; user-select: text; flex: none; }
#to-review { display: flex; gap: 8px; align-items: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="drag"></div>
<main id="editor" hidden>
  <div class="rowb"><h1 id="host" class="grow"></h1><input type="checkbox" id="on"><span data-t="boost.enabled"></span></div>
  <input id="name" maxlength="60" spellcheck="false" data-t-ph="boost.name">
  <div class="hint warn" id="to-review" hidden><span class="grow" data-t="boost.toReviewHint"></span><button class="btn" id="review-open" data-t="boost.reviewBtn"></button></div>
  <div class="hint" id="note" hidden></div>

  <h2 data-t="boost.look"></h2>
  <div id="swatches"></div>
  <div class="rowb"><input type="checkbox" id="invert"><span class="grow" data-t="boost.invert"></span></div>
  <div class="rowb"><label for="contrast" data-t="boost.contrast"></label><input type="range" id="contrast" min="50" max="150" step="5"><output id="contrast-v"></output></div>
  <div class="rowb"><label for="brightness" data-t="boost.brightness"></label><input type="range" id="brightness" min="50" max="150" step="5"><output id="brightness-v"></output></div>
  <div class="rowb"><label for="saturation" data-t="boost.saturation"></label><input type="range" id="saturation" min="0" max="200" step="10"><output id="saturation-v"></output></div>

  <h2 data-t="boost.text"></h2>
  <div class="rowb"><label for="font" data-t="boost.font"></label><select id="font" class="grow"></select></div>
  <div class="rowb"><label for="size" data-t="boost.size"></label><input type="range" id="size" min="90" max="150" step="5"><output id="size-v"></output></div>
  <div class="rowb"><label for="case" data-t="boost.case"></label><select id="case" class="grow"></select></div>
  <div class="rowb"><button class="btn" id="reset-look" data-t="boost.resetLook"></button></div>

  <h2 data-t="boost.zapTitle"></h2>
  <div id="zaps"></div>
  <div class="rowb"><button class="btn primary" id="zap" data-t="boost.zap"></button><span class="hint grow" data-t="boost.zapHint"></span></div>

  <h2>CSS</h2>
  <textarea id="css" spellcheck="false" data-t-ph="boost.placeholder"></textarea>

  <h2>JavaScript</h2>
  <div class="rowb"><input type="checkbox" id="js-on"><span class="grow" data-t="boost.jsOn"></span></div>
  <div class="hint" id="js-off" hidden><span data-t="boost.jsOff"></span> <button class="btn" id="js-settings" data-t="boost.openSettings"></button></div>
  <textarea id="js" spellcheck="false" data-t-ph="boost.jsPlaceholder"></textarea>
  <div class="hint warn" id="js-error" hidden></div>
  <div class="rowb"><span class="hint grow" data-t="boost.jsHint"></span><button class="btn" id="reload" data-t="boost.reload"></button></div>

  <div id="foot">
    <button class="btn" id="reset" data-t="boost.resetAll"></button>
    <button class="btn" id="export" data-t="boost.export"></button>
    <button class="btn" id="all" data-t="boost.all"></button>
  </div>
</main>
<main id="list" hidden>
  <h1 data-t="boost.all"></h1>
  <div class="hint" id="list-note" hidden></div>
  <div id="list-items"></div>
  <div class="empty" id="list-empty" data-t="boost.none" hidden></div>
  <div id="foot">
    <button class="btn" id="import" data-t="boost.import"></button>
    <button class="btn" id="export-all" data-t="boost.exportAll"></button>
  </div>
</main>
<section id="review" hidden>
  <h1 data-t="boost.reviewTitle"></h1>
  <div class="hint" id="review-host"></div>
  <div class="hint" data-t="boost.reviewHint"></div>
  <div class="hint warn" id="review-warn" hidden></div>
  <div class="hint" id="review-look" data-t="boost.reviewLook" hidden></div>
  <h2>CSS</h2>
  <pre id="review-css"></pre>
  <div id="review-zaps-box" hidden><h2 data-t="boost.reviewZaps"></h2><pre id="review-zaps"></pre></div>
  <div id="review-js-box" hidden><h2>JavaScript</h2><div class="hint" data-t="boost.reviewJs"></div><pre id="review-js"></pre></div>
  <div id="foot">
    <button class="btn primary" id="review-ok" data-t="boost.reviewOk"></button>
    <button class="btn" id="review-cancel" data-t="sheet.cancel"></button>
  </div>
</section>
<script src="common.js"></script>
<script src="boost.js"></script>
</body>
</html>
