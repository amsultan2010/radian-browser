<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
<title>Orbe</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
/* Tableaux : une grille de vignettes. */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.board { position: relative; padding: 0; overflow: hidden; }
.board:hover { box-shadow: var(--active-shadow), 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
.board .thumb { height: 132px; display: grid; place-items: center; background: var(--pill); border-bottom: 0.5px solid var(--line); }
.board .thumb img { max-width: 100%; max-height: 132px; display: block; }
.board .meta { padding: 9px 12px 10px; }
.board .del { position: absolute; top: 8px; right: 8px; opacity: 0; background: var(--panel); }
.board:hover .del { opacity: 1; }
.line .sub.danger { color: #c2410c; }
.tabs { flex-wrap: wrap; }
/* Archive : filtres (façon de fermer, Espace) ; croix d'une entrée, visible au survol. */
#filters { display: flex; align-items: center; gap: 8px; margin: -4px 0 14px; }
#filters [hidden] { display: none; }
#from-label { color: var(--dim); font-size: 12.5px; }
.line .x { opacity: 0; width: 26px; padding: 0; }
.line:hover .x, .line .x:focus-visible { opacity: 1; }
.line .tag { flex: none; color: var(--dim); font-size: 11.5px; background: var(--pill); border-radius: 6px; padding: 2px 7px; }
.line[draggable=true] { cursor: default; }
.line .more { width: 28px; padding: 0; font-weight: 700; letter-spacing: 1px; }
.line .dot { width: 18px; height: 18px; border-radius: 6px; flex: none; display: grid; place-items: center; font-size: 13px; }
.line.off .name { color: var(--dim); }
.empty .hint { margin-top: 6px; font-size: 12.5px; color: var(--faint); }
/* Icônes des sections : dessins d'Orbe, animés une fois au survol et à la sélection
   (transformations seulement ; « Réduire les animations » : base.css les fige). */
.tabs button { display: inline-flex; align-items: center; gap: 6px; padding: 0 11px 0 9px; }
.tabs button#clear { padding: 0 12px; }
.ti { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; overflow: visible; }
.ti .m, .ti .m2 { transform-box: fill-box; transform-origin: center; }
.tabs button.on .ti { color: var(--accent); }
.tabs [data-tab="history"]:is(:hover, .on) .m { transform-box: view-box; transform-origin: 8px 8px; animation: ti-clock 620ms var(--ease) both; }
.tabs [data-tab="archive"]:is(:hover, .on) .m { transform-origin: 10% 100%; animation: ti-lid var(--spring-bouncy) both; animation-duration: 520ms; }
.tabs [data-tab="downloads"]:is(:hover, .on) .m { animation: ti-drop 520ms var(--ease) both; }
.tabs [data-tab="media"]:is(:hover, .on) .m { animation: ti-rise var(--spring-bouncy) both; animation-duration: 480ms; }
.tabs [data-tab="media"]:is(:hover, .on) .m2 { animation: ti-pop var(--spring-bouncy) 120ms both; }
.tabs [data-tab="easels"]:is(:hover, .on) .m { transform-origin: 50% 0; animation: ti-sway 620ms var(--ease) both; }
.tabs [data-tab="spaces"]:is(:hover, .on) .m { animation: ti-hop 420ms var(--ease) both; }
.tabs [data-tab="spaces"]:is(:hover, .on) .m2 { animation-delay: 70ms; }
.tabs [data-tab="spaces"]:is(:hover, .on) .m3 { animation-delay: 140ms; }
.tabs [data-tab="boosts"]:is(:hover, .on) .m { animation: ti-zap 520ms var(--ease) both; }
@keyframes ti-clock { from { transform: rotate(-360deg); } to { transform: none; } }
@keyframes ti-lid { 0% { transform: none; } 40% { transform: translateY(-1.6px) rotate(-14deg); } 100% { transform: none; } }
@keyframes ti-drop { 0% { transform: translateY(-5px); opacity: 0; } 55% { transform: translateY(1.2px); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes ti-rise { from { transform: translateY(3px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ti-pop { from { transform: scale(0); } to { transform: none; } }
@keyframes ti-sway { 0% { transform: none; } 30% { transform: rotate(-7deg); } 65% { transform: rotate(4deg); } 100% { transform: none; } }
@keyframes ti-hop { 0% { transform: none; } 40% { transform: translateY(-2.6px) scale(1.15); } 100% { transform: none; } }
@keyframes ti-zap { 0% { transform: none; } 25% { transform: scale(1.28) rotate(-8deg); } 55% { transform: scale(0.94) rotate(4deg); } 100% { transform: none; } }
</style>
</head>
<body>
<main>
  <h1 data-t="lib.title"></h1>
  <div class="tabs">
    <button data-tab="history"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path class="m" d="M8 4.8V8l2.2 1.4"/></svg><span data-t="lib.history"></span></button>
    <button data-tab="archive"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.2 6.6v5a1.6 1.6 0 0 0 1.6 1.6h6.4a1.6 1.6 0 0 0 1.6-1.6v-5M6.500 9.200h3"/><rect class="m" x="2.2" y="3.200" width="11.600" height="3.400" rx="1.200"/></svg><span data-t="lib.archive"></span></button>
    <button data-tab="downloads"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 11.400v.800a1.400 1.400 0 0 0 1.400 1.400h7.200a1.400 1.400 0 0 0 1.400-1.400v-.800"/><path class="m" d="M8 2.600v7.200M5.200 7.200 8 10l2.800-2.800"/></svg><span data-t="lib.downloads"></span></button>
    <button data-tab="media"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.400" y="3" width="11.200" height="10" rx="1.800"/><path class="m" d="m3.200 11.400 3-3.200 2.400 2.400 1.600-1.600 2.600 2.600"/><path class="m2" d="M10.400 6h.01" stroke-width="1.900"/></svg><span data-t="lib.media"></span></button>
    <button data-tab="easels"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.400 11.400 4 14M10.600 11.400 12 14M8 11.400V14"/><rect class="m" x="2.600" y="2.400" width="10.800" height="9" rx="1.400"/></svg><span data-t="lib.easels"></span></button>
    <button data-tab="spaces"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><circle class="m" cx="4" cy="8" r="1.500"/><circle class="m m2" cx="8" cy="8" r="1.500"/><circle class="m m3" cx="12" cy="8" r="1.500"/></svg><span data-t="lib.spaces"></span></button>
    <button data-tab="boosts"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path class="m" d="M8.800 2.200 4 9h3.400l-.800 4.800L12 7H8.400z"/></svg><span data-t="lib.boosts"></span></button>
    <span style="flex:1"></span>
    <button id="clear"></button>
  </div>
  <input class="search" id="q" data-t-ph="lib.search" spellcheck="false">
  <!-- Archive : « How was the tab closed? », « Where was the tab? » d'Arc. -->
  <div id="filters" hidden>
    <select id="f-how"></select>
    <select id="f-space"></select>
    <!-- Médias : « Show media from: » d'Arc. Un dossier n'est lu que lorsqu'on le choisit ici. -->
    <label id="from-label" for="f-from" data-t="lib.from"></label>
    <select id="f-from"></select>
  </div>
  <div id="list"></div>
</main>
<script src="common.js"></script>
<script src="library.js"></script>
</body>
</html>
