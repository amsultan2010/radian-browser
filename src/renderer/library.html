<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
<title>Radian</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
/* As in Arc 1.170 (docs/parity/captures/live/library.md): a full-height panel in the sidebar's place,
   417 pt wide, 744 for Spaces (window.js): a 112 pt rail of sections, the section on its right. The
   panel is see-through: the Space's colours, painted by the shell under it, show as in Arc. */
:root { --lib-blue: #212af0; /* Arc's selected section icon and new-Space button, sampled */ --veil: color-mix(in srgb, var(--fg) 4%, transparent); }
html, body { background: transparent; overflow: hidden; }
#panel { display: flex; height: 100%; }
#panel.in { animation: lib-in var(--library-slide) both; }
@keyframes lib-in { from { transform: translateX(-100%); } }
#rail { flex: none; width: 112px; display: flex; flex-direction: column; padding: 105px 0 8px 8px; background: color-mix(in srgb, var(--fg) 2.5%, transparent); border-right: 1px solid color-mix(in srgb, var(--fg) 8%, transparent); -webkit-app-region: drag; }
#rail button { -webkit-app-region: no-drag; }
/* Six 97 × 80 buttons at a 100 pt pitch (History, Radian's own, after them; the list scrolls when the window is short). */
.tabs { flex: 1; min-height: 0; flex-direction: column; gap: 20px; margin: 0; overflow-y: auto; scrollbar-width: none; }
.tabs button { flex: none; width: 97px; height: 80px; padding: 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--fg) 82%, transparent); }
.tabs button:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
.tabs button.on { background: color-mix(in srgb, var(--fg) 11%, transparent); color: var(--fg); }
.ti { width: 26px; height: 26px; flex: none; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
/* Selected: the icon turns blue and filled, its inner strokes white. */
.on .ti { color: var(--lib-blue); }
.on .ti .f { fill: currentColor; }
.on .ti .k { stroke: #fff; }
#rail-foot { flex: none; display: flex; padding-top: 8px; }
.ib { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: color-mix(in srgb, var(--fg) 70%, transparent); }
.ib:hover { background: var(--hover); color: var(--fg); }
#page { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#bar { flex: none; display: flex; gap: 4px; padding: 10px 9px 0 8px; }
#search { flex: 1; min-width: 0; height: 36px; border-radius: 10px; display: flex; align-items: center; gap: 15px; padding: 0 14px; background: color-mix(in srgb, var(--fg) 9%, transparent); color: var(--dim); }
#q { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; padding: 0; background: none; font-size: 14px; color: var(--fg); user-select: text; }
#q::placeholder { color: var(--dim); }
#filter { flex: none; width: 73px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: var(--dim); background: color-mix(in srgb, var(--fg) 6%, transparent); }
#filter:hover, #filter.on { color: var(--fg); background: color-mix(in srgb, var(--fg) 10%, transparent); }
/* Behind Filter: the archive's two filters (how the tab closed, which Space), where media come from, and clearing the list. */
#filters { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 9px 0 8px; }
#from-label { color: var(--dim); font-size: 12.5px; }
#list { flex: 1; min-height: 0; position: relative; overflow-y: auto; padding: 8px 8px 24px; }
#list h2 { font-size: 11px; font-weight: 600; color: var(--dim); text-transform: none; letter-spacing: 0; margin: 0 4px 4px; }
#list .card + h2 { margin-top: 14px; }
#list .card { background: none; box-shadow: none; border-radius: 0; overflow: visible; }
/* Rows as Arc's Archived Tabs: favicon 16, title 13 over address 11, at a 56 pt pitch. */
.line { min-height: 56px; padding: 6px 8px 6px 14px; gap: 14px; border-radius: 10px; }
.line + .line { border-top: 0; }
.line .name { font-size: 13px; }
.line .sub { font-size: 11px; }
.line .sub.danger { color: #c2410c; }
.line .when { flex: none; font-size: 11px; }
.line.off .name { color: var(--dim); }
.line[draggable=true] { cursor: default; }
/* A row's buttons show on hover (always while a download runs). */
.line > .btn { flex: none; height: 24px; padding: 0 8px; font-size: 12px; opacity: 0; }
.line:hover > .btn, .line > .btn:focus-visible, .line[data-state=progressing] > .btn { opacity: 1; }
.line > .btn.icon { width: 24px; padding: 0; display: grid; place-items: center; }
/* Empty sections: Arc's large icon, title and line of help, in the middle of the list. */
.empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 24px 40px; text-align: center; color: var(--dim); }
.empty .ti { width: 48px; height: 48px; margin-bottom: 14px; opacity: 0.55; color: var(--fg); }
.empty > div:first-of-type { font-size: 17px; font-weight: 600; color: var(--fg); }
.empty .hint { margin-top: 8px; max-width: 250px; font-size: 14px; line-height: 1.4; color: var(--dim); }
/* Media: Arc's "Your Media in the Library" card; its button shows a folder of the user's. */
.tip { width: 250px; padding: 22px 20px 18px; border-radius: 16px; background: var(--panel); color: var(--fg); box-shadow: 0 10px 50px color-mix(in srgb, #6d6cf5 45%, transparent); }
.tip .ti { opacity: 1; color: #9a8cf0; margin-bottom: 10px; }
.tip b { display: block; font-size: 15px; margin-bottom: 8px; }
.tip p { margin: 0 0 14px; font-size: 13px; line-height: 1.4; }
.tip .go { width: 100%; height: 40px; border-radius: 8px; font-size: 15px; font-weight: 500; color: #fff; background: linear-gradient(90deg, #d999bd, #5a6cf0); }
.tip small { display: flex; gap: 6px; margin-top: 12px; text-align: left; font-size: 11.5px; color: var(--dim); }
.tip small svg { flex: none; margin-top: 1px; }
/* Easels and Notes: thumbnails (or the start of a Note's text); a click opens them in Peek. */
.boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
#list .board { position: relative; padding: 0; overflow: hidden; background: var(--veil); border-radius: 12px; }
.board:hover { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 55%, transparent); }
.board .thumb { height: 132px; display: grid; place-items: center; background: var(--pill); }
.board .thumb img { max-width: 100%; max-height: 132px; display: block; }
.board .thumb.text { place-items: start; padding: 10px 12px; overflow: hidden; color: var(--dim); font-size: 12px; white-space: pre-line; }
.board .meta { padding: 9px 12px 10px; }
.board .del { position: absolute; top: 8px; right: 8px; opacity: 0; background: var(--panel); }
.board:hover .del { opacity: 1; }
/* Spaces: Arc's Space manager, one column per Space in its colours, a round + for a new one. */
body[data-kind=spaces] :is(#bar, #filters) { display: none; }
#list.cols { display: flex; gap: 24px; padding: 48px 28px 50px; overflow: auto hidden; }
.col { flex: none; width: 240px; display: flex; flex-direction: column; padding: 14px 8px 8px; border-radius: 12px; background: linear-gradient(var(--veil), var(--veil)), var(--col-paint, transparent); }
.col.drop { box-shadow: 0 0 0 2px color-mix(in srgb, var(--lib-blue) 70%, transparent); }
.col-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 2px 0 10px; }
.col-name { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: color-mix(in srgb, var(--fg) 75%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.col-list { flex: 1; min-height: 0; overflow-y: auto; margin-top: 6px; }
.item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; padding: 4px 10px; border-radius: 8px; text-align: left; }
.item:hover { background: var(--hover); }
.item .grow { flex: 1; min-width: 0; }
.item .name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.folder .name { font-weight: 600; }
.folder-i { width: 18px; height: 18px; flex: none; fill: var(--lib-blue); stroke: none; }
.col-clear { display: flex; align-items: center; gap: 8px; margin: 4px 0 4px 10px; }
.col-clear::before { content: ''; flex: 1; height: 1px; background: var(--line); }
.col-clear button { display: flex; align-items: center; gap: 3px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 600; color: var(--dim); }
.col-clear button:hover { background: var(--hover); color: var(--fg); }
.col-foot { flex: none; display: flex; justify-content: space-between; padding-top: 6px; }
.col-move { cursor: grab; }
.add-space { flex: none; align-self: center; width: 30px; height: 30px; margin-left: 8px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--lib-blue); }
.add-space:hover { filter: brightness(1.12); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="m10.4 10.4 3.2 3.2"/></symbol>
  <symbol id="i-filter" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 6.3h5.6M6.2 8.3h3.6M7.2 10.3h1.6"/></symbol>
  <symbol id="i-back" viewBox="0 0 16 16"><path d="M13.2 8H3.2M7.2 4l-4 4 4 4"/></symbol>
  <symbol id="i-open" viewBox="0 0 16 16"><path d="M9.4 2.8h3.8v3.8M13.2 2.8 8 8M11.6 9.6v2.2a1.4 1.4 0 0 1-1.4 1.4H4.2a1.4 1.4 0 0 1-1.4-1.4V5.8a1.4 1.4 0 0 1 1.4-1.4h2.2"/></symbol>
  <symbol id="i-more" viewBox="0 0 16 16"><path d="M3.5 8h.01M8 8h.01M12.5 8h.01" stroke-width="2.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 16 16"><path d="m10.4 3.4 2.2 2.2-6.8 6.8-2.8.6.6-2.8z"/></symbol>
  <symbol id="i-move" viewBox="0 0 16 16"><path d="M8 2.6v10.8M2.6 8h10.8M6.4 4.2 8 2.6l1.6 1.6M6.4 11.8 8 13.4l1.6-1.6M4.2 6.4 2.6 8l1.6 1.6M11.8 6.4 13.4 8l-1.6 1.6"/></symbol>
  <symbol id="i-plus" viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9" stroke-width="2"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v10M4.5 9.5 8 13l3.5-3.5"/></symbol>
  <symbol id="i-folder" viewBox="0 0 16 16"><path d="M1.8 4.6A1.6 1.6 0 0 1 3.4 3h2.8l1.5 1.6h4.9a1.6 1.6 0 0 1 1.6 1.6v5.2a1.6 1.6 0 0 1-1.6 1.6H3.4a1.6 1.6 0 0 1-1.6-1.6z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16"><path d="M8 2 3.4 3.6v3.8c0 2.9 2 5.2 4.6 6.2 2.6-1 4.6-3.3 4.6-6.2V3.6z"/><path d="M6.2 7.6h3.6v2.6H6.2zM6.9 7.6v-.9a1.1 1.1 0 0 1 2.2 0v.9"/></symbol>
</svg>
<div id="panel">
<nav id="rail">
  <!-- Arc's six sections in Arc's order, then Radian's History. Icons: Radian's own drawings. -->
  <div class="tabs">
    <button data-tab="media"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.8 3h7.4A1.8 1.8 0 0 1 14 4.8v6"/><rect class="f" x="2" y="5" width="10.4" height="8.2" rx="1.6"/><path class="k" d="m3.2 12 2.8-2.9 2.1 2.1 1.4-1.4 2 2"/><path class="k" d="M9.6 7.5h.01" stroke-width="1.8"/></svg><span data-t="lib.media"></span></button>
    <button data-tab="downloads"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><circle class="f" cx="8" cy="8" r="6.2"/><path class="k" d="M8 4.9v5.8M5.6 8.4 8 10.8l2.4-2.4"/></svg><span data-t="lib.downloads"></span></button>
    <button data-tab="easels"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><rect class="f" x="2.2" y="2.8" width="11.6" height="10.4" rx="2"/><path class="k" d="M2.2 5.6h11.6M6 11l3.8-3.8M7.6 11.4l2.4-2.4"/></svg><span data-t="lib.easels"></span></button>
    <button data-tab="spaces"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.4 3.5 3.1 4.3a1.4 1.4 0 0 0-.8 1.8l2.4 6.6"/><rect class="f" x="5.6" y="2.6" width="8.2" height="10.8" rx="1.6"/></svg><span data-t="lib.spaces"></span></button>
    <button data-tab="boosts"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><path class="f" d="M10.4 2.4a1.6 1.6 0 0 1 2.3 0l.9.9a1.6 1.6 0 0 1 0 2.3L8.4 10.8 5.2 7.6z"/><path d="M5.2 7.6 3.6 9.2c-1 1-.8 2.6-.6 3.8 1.2.2 2.8.4 3.8-.6l1.6-1.6M12.6 9.8v3M11.1 11.3h3"/></svg><span data-t="lib.boosts"></span></button>
    <button data-tab="archive"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><rect class="f" x="2.2" y="3" width="11.6" height="3.4" rx="1.1"/><path class="f" d="M3.2 6.4v5.4a1.6 1.6 0 0 0 1.6 1.6h6.4a1.6 1.6 0 0 0 1.6-1.6V6.4"/><path class="k" d="M6.5 9h3"/></svg><span data-t="lib.archivedTabs"></span></button>
    <button data-tab="history"><svg class="ti" viewBox="0 0 16 16" aria-hidden="true"><circle class="f" cx="8" cy="8" r="6"/><path class="k" d="M8 4.9V8l2.2 1.4"/></svg><span data-t="lib.history"></span></button>
  </div>
  <div id="rail-foot"><button class="ib" id="exit" data-t-title="lib.exit"><svg class="i"><use href="#i-back"/></svg></button></div>
</nav>
<div id="page">
  <div id="bar">
    <label id="search"><svg class="i" style="width:15px;height:15px"><use href="#i-search"/></svg><input id="q" spellcheck="false"></label>
    <button id="filter"><svg class="i"><use href="#i-filter"/></svg><span data-t="lib.filter"></span></button>
  </div>
  <div id="filters" hidden>
    <!-- Archive : « How was the tab closed? », « Where was the tab? » d'Arc. -->
    <select id="f-how"></select>
    <select id="f-space"></select>
    <!-- Médias : « Show media from: » d'Arc. Un dossier n'est lu que lorsqu'on le choisit ici. -->
    <label id="from-label" for="f-from" data-t="lib.from"></label>
    <select id="f-from"></select>
    <button id="clear" class="btn"></button>
  </div>
  <div id="list"></div>
</div>
</div>
<script src="common.js"></script>
<script src="theme.js"></script>
<script src="library.js"></script>
</body>
</html>
