<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Radian</title>
<link rel="stylesheet" href="base.css">
<style>
/* Cadre aux couleurs de l'Espace où ⌘O enverra la page (little.js) ; à défaut, l'accent par défaut. */
body { background: var(--paint, color-mix(in srgb, color-mix(in srgb, var(--accent) var(--tint), var(--base)) 80%, transparent)); }
#bar { height: 42px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 76px; -webkit-app-region: drag; }
/* Comme dans Arc : le domaine seul, centré dans la barre ; le champ ne paraît qu'à la saisie. */
#u { flex: 1; min-width: 0; height: 28px; border-radius: 8px; border: 0; outline: 0; background: none; padding: 0 10px; text-align: center; -webkit-app-region: no-drag; user-select: text; }
#u:focus, #u:hover { background: var(--pill); }
#u-wrap { flex: 1; min-width: 0; position: relative; display: flex; }
/* Hors saisie : le site, domaine en avant, coupé par la gauche s'il est trop long (common.js). */
#u-site { position: absolute; inset: 0 10px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
#u-wrap.site #u:not(:focus) { color: transparent; }
#u:focus + #u-site { display: none; }
#u:focus { text-align: left; outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
#open { height: 28px; padding: 0 12px; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; -webkit-app-region: no-drag; white-space: nowrap; }
#open[disabled] { opacity: 0.4; }
#open kbd { margin-left: 6px; font: inherit; font-weight: 500; opacity: 0.75; }
#open { border-radius: 8px 0 0 8px; margin-right: -7px; }
#open-in { height: 28px; width: 24px; border-radius: 0 8px 8px 0; background: color-mix(in srgb, var(--accent) 82%, #000); color: #fff; -webkit-app-region: no-drag; }
#copy, #find-u, #exts { height: 28px; width: 28px; flex: none; border-radius: 8px; display: grid; place-items: center; color: var(--dim); -webkit-app-region: no-drag; }
#copy:hover, #find-u:hover, #exts:hover { background: var(--hover); color: var(--fg); }
#copy[disabled] { opacity: 0.4; }
#copy svg, #find-u svg, #exts svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
#copy.done { color: var(--accent); }
/* Menu « Ouvrir dans… » : la barre passe au-dessus de la page, qui reste visible derrière un voile. */
body.menu { background: transparent; }
body.menu #bar { background: var(--paint, color-mix(in srgb, var(--accent) var(--tint), var(--base))); }
#veil { position: fixed; inset: 42px 0 0 0; background: rgba(0, 0, 0, 0.22); }
#spaces { position: fixed; top: 40px; right: 8px; width: 250px; max-height: calc(100vh - 56px); display: flex; flex-direction: column; gap: 6px; padding: 8px; border-radius: 12px; background: var(--base); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), 0 0 0 0.5px var(--line); }
#space-search { height: 28px; border: 0; outline: 0; border-radius: 8px; background: var(--pill); padding: 0 10px; user-select: text; }
#space-list { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
#space-list button { height: 30px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 7px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#space-list button.sel, #space-list button:hover { background: var(--hover); }
#space-none { color: var(--dim); font-size: 12px; padding: 4px 8px; }
/* Première petite fenêtre : un bandeau d'explication entre la barre et la page. */
#hint { position: fixed; top: 42px; left: 6px; right: 6px; height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 16%, transparent); font-size: 12px; color: var(--fg); animation: hint-in var(--spring-smooth) both; }
#hint span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#hint button { width: 22px; height: 22px; border-radius: 6px; color: var(--dim); }
#hint button:hover { background: var(--hover); color: var(--fg); }
@keyframes hint-in { from { opacity: 0; transform: translateY(-6px); } }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="bar">
  <button id="find-u" data-t-title="cmd.placeholder"><svg viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="3.8"/><path d="m10.2 10.2 3 3"/></svg></button>
  <div id="u-wrap"><input id="u" spellcheck="false" autocomplete="off" data-t-ph="cmd.placeholder"><div id="u-site"></div></div>
  <!-- As in Little Arc: a puzzle button, left of the copy button, lists the extensions (little.js). -->
  <button id="exts" data-t-title="menu.extensions" hidden><svg viewBox="0 0 16 16"><path d="M3 5.5h2.6a1.6 1.6 0 1 1 3 0h2.4v2.4a1.6 1.6 0 1 1 0 3V13H3z"/></svg></button>
  <button id="copy" data-t-title="side.copyLink"><svg viewBox="0 0 16 16"><path d="M6.9 9.1a2.7 2.7 0 0 0 3.8 0l1.9-1.9a2.7 2.7 0 0 0-3.8-3.8l-.7.7"/><path d="M9.1 6.9a2.7 2.7 0 0 0-3.8 0L3.4 8.8a2.7 2.7 0 0 0 3.8 3.8l.7-.7"/></svg></button>
  <!-- « Open in ‹Espace› ⌘O », comme dans Arc : l'Espace qui recevra la page. -->
  <button id="open"><span id="open-label" data-t="little.open"></span><kbd>⌘O</kbd></button>
  <button id="open-in" title="⌥⌘O">▾</button>
</div>
<div id="hint" hidden><span data-t="little.hint"></span><button id="hint-close" data-t-title="little.hintClose">×</button></div>
<div id="veil" hidden></div>
<div id="spaces" hidden>
  <input id="space-search" spellcheck="false" autocomplete="off" data-t-ph="little.searchSpaces">
  <div id="space-list"></div>
  <div id="space-none" data-t="little.noSpace" hidden></div>
</div>
<script src="common.js"></script>
<script src="theme.js"></script>
<script src="little.js"></script>
</body>
</html>
