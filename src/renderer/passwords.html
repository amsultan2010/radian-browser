<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Orbe</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<style>
html, body { background: transparent; }
body { background: color-mix(in srgb, var(--base) 82%, transparent); }
#drag { position: fixed; inset: 0 0 auto 0; height: 38px; -webkit-app-region: drag; }
main { padding: 46px 26px 30px; }
h1 { font-size: 20px; margin-bottom: 6px; }
.tools { display: flex; gap: 8px; align-items: center; margin: 14px 0; }
.tools .search { margin: 0; flex: 1; }
.notice { border-radius: 10px; padding: 10px 14px; margin: 12px 0; background: color-mix(in srgb, #f59e0b 22%, transparent); }
.notice .btn { margin-top: 8px; }
.secret { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; user-select: text; }
.form { display: grid; grid-template-columns: 110px 1fr auto; gap: 8px 10px; align-items: center; padding: 12px 14px; }
.form input { height: 30px; border-radius: 8px; border: 0; outline: 0; background: var(--pill); padding: 0 10px; user-select: text; min-width: 0; }
.form input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
.form .wide { grid-column: 2 / 4; }
.form .actions { grid-column: 1 / 4; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.form .err { color: #dc2626; flex: 1; }
#msg { min-height: 18px; margin: 8px 4px 0; font-size: 12px; }
</style>
</head>
<body>
<div id="drag"></div>
<main>
  <h1 data-t="pw.heading"></h1>
  <p class="muted" style="margin:0 0 4px;font-size:12px" data-t="pw.storageHint"></p>
  <div class="notice" id="notice" hidden><div id="notice-text"></div><button class="btn" id="reset" data-t="pw.reset" hidden></button></div>

  <div class="tools">
    <select id="profile" hidden></select>
    <input class="search" id="q" spellcheck="false" data-t-ph="pw.search">
    <button class="btn primary" id="add" data-t="pw.add"></button>
    <button class="btn" id="import" data-t="pw.importBtn"></button>
    <button class="btn" id="export" data-t="pw.exportBtn"></button>
  </div>
  <div class="card" id="new" hidden></div>
  <div class="card" id="list" style="margin-top:10px"></div>
  <p class="muted" id="msg"></p>
  <p class="muted" style="margin:4px 4px 0;font-size:12px" data-t="pw.csvHint"></p>

  <div id="never-block" hidden>
    <h2 data-t="pw.neverTitle"></h2>
    <div class="card" id="never"></div>
  </div>
</main>
<script src="common.js"></script>
<script src="passwords.js"></script>
</body>
</html>
