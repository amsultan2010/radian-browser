<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: http: data:; style-src 'self' 'unsafe-inline'">
<title>Radian</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7.2" cy="7.2" r="3.8"/><path d="m10.2 10.2 3 3"/></symbol>
  <symbol id="i-globe" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11M8 2.5c1.8 1.6 1.8 9.4 0 11M8 2.5c-1.8 1.6-1.8 9.4 0 11"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 16 16"><path d="M8.8 2.5 4 9h3.6l-.4 4.5L12 7H8.4z"/></symbol>
  <symbol id="i-up" viewBox="0 0 16 16"><path d="m4.5 9.5 3.5-3.5 3.5 3.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 16 16"><path d="m4.5 6.5 3.5 3.5 3.5-3.5"/></symbol>
  <symbol id="i-expand" viewBox="0 0 16 16"><path d="M9.5 3h3.5v3.5M13 3 8.8 7.2M6.5 13H3V9.5M3 13l4.2-4.2"/></symbol>
  <symbol id="i-split" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2.5"/><path d="M8 3v10"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16"><path d="m4.8 4.8 6.4 6.4m0-6.4-6.4 6.4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 16 16"><path d="M3.5 8h9M8.8 4.2 12.6 8l-3.8 3.8"/></symbol>
</svg>

<div id="backdrop"></div>

<div id="command" class="panel" hidden>
  <div id="cmd-field">
    <span id="cmd-icon"><svg class="i"><use href="#i-search"/></svg></span>
    <!-- Portée de la recherche : « Actions » (⇥ sur une barre vide) ou le site où l'on cherche. -->
    <span id="cmd-scope" hidden></span>
    <input id="cmd-input" spellcheck="false" autocomplete="off" data-t-ph="cmd.placeholder">
    <!-- Little Radian's command window only (⌥⌘N, little.js). -->
    <button id="cmd-close" tabindex="-1" data-tip="sheet.close"><svg class="i"><use href="#i-x"/></svg></button>
  </div>
  <div id="cmd-list"></div>
</div>

<div id="switcher" class="panel" hidden></div>

<!-- Sélecteur de thème, disposé comme celui d'Arc ; se ferme d'un clic à côté ou par Échap.
     As in Arc 1.170: a popover right of the sidebar, the appearance buttons and − / + drawn
     inside the colour field, the swatch pages under it, the intensity wave and noise dial below. -->
<div id="theme" class="panel" role="dialog" aria-labelledby="theme-name" hidden>
  <span id="theme-name" data-t="theme.title" hidden></span>
  <!-- Apparence de l'Espace : automatique, claire, sombre (icônes animées). -->
  <div id="theme-modes" role="radiogroup">
    <button class="mode" data-mode="auto" role="radio" data-tip="theme.autoAppearance"><svg class="i" viewBox="0 0 16 16"><path class="star s1" d="M6 2.6l.9 2.5 2.5.9-2.5.9L6 9.4l-.9-2.5-2.5-.9 2.5-.9z"/><path class="star s2" d="M11.4 8.6l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg></button>
    <button class="mode" data-mode="light" role="radio" data-tip="theme.lightAppearance"><svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.7"/><path class="rays" d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg></button>
    <button class="mode" data-mode="dark" role="radio" data-tip="theme.darkAppearance"><svg class="i" viewBox="0 0 16 16"><path class="moon" d="M12.9 9.6A5.4 5.4 0 0 1 6.4 3.1a5.4 5.4 0 1 0 6.5 6.5z"/><path class="star" d="M12.3 1.6l.45 1.25 1.25.45-1.25.45-.45 1.25-.45-1.25-1.25-.45 1.25-.45z"/></svg></button>
  </div>
  <!-- Champ de couleurs : une grille de points (la teinte tourne autour du centre,
       la saturation croît vers le bord) ; une poignée par couleur, la première plus grande. -->
  <div id="theme-wheel"><canvas id="theme-grid"></canvas><div id="theme-plain" data-t="theme.tapToPick"></div></div>
  <div id="theme-count">
    <button class="tb" id="theme-less" data-t-title="theme.remove"><svg class="i" viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
    <button class="tb" id="theme-more" data-t-title="theme.add"><svg class="i" viewBox="0 0 16 16"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
  </div>
  <!-- Thèmes prêts : neuf pastilles par page entre deux flèches ; la bande glisse d'une page à l'autre. -->
  <div id="theme-pages">
    <button class="pg" id="theme-prev" data-t-title="theme.prev"><svg class="i" viewBox="0 0 16 16"><path d="m10.2 1.6-6.4 6.4 6.4 6.4"/></svg></button>
    <div id="theme-view"><div id="theme-presets"></div></div>
    <button class="pg" id="theme-next" data-t-title="theme.next"><svg class="i" viewBox="0 0 16 16"><path d="m5.8 1.6 6.4 6.4-6.4 6.4"/></svg></button>
  </div>
  <!-- Intensité : une vague de six périodes sur une piste arrondie, curseur en pilule blanche.
       Grain : une molette, vingt points autour d'un cercle, que l'on tourne. -->
  <div id="theme-tune">
    <div id="theme-wave">
      <svg viewBox="0 -14 212 28"><path d="M0 0c7.5-15.33 10.17-15.33 17.67 0s10.17 15.33 17.67 0s10.17-15.33 17.67 0s10.17 15.33 17.67 0s10.17-15.33 17.67 0s10.17 15.33 17.67 0s10.17-15.33 17.67 0s10.17 15.33 17.67 0s10.17-15.33 17.67 0s10.17 15.33 17.67 0s10.17-15.33 17.67 0s10.17 15.33 17.67 0"/></svg>
      <input id="theme-intensity" type="range" min="0" max="100" value="50" data-t-title="theme.intensity">
    </div>
    <!-- As in Arc, a click on the dial switches to the next texture, shown on its face. -->
    <div id="theme-dial" data-t-title="theme.cycleTexture"><svg id="theme-ring" viewBox="0 0 84 84"><circle class="rim" cx="42" cy="42" r="20"/></svg><span class="face"></span><input id="theme-grain" type="range" min="0" max="100" value="0" data-t-title="theme.grain"></div>
  </div>
</div>

<!-- Création d'un Espace : nom, icône, couleur, profil ; rien n'est créé avant « Créer ». -->
<div id="space" class="panel" role="dialog" hidden>
  <h3 data-t="space.title"></h3>
  <div id="space-id">
    <button id="space-icon" data-t-title="space.icon"></button>
    <input id="space-input" spellcheck="false" autocomplete="off" maxlength="80" data-t-ph="spaces.defaultName">
  </div>
  <label data-t="space.color"></label>
  <div id="space-colors" role="radiogroup"></div>
  <div id="space-presets" role="radiogroup"></div>
  <button id="space-theme" class="space-link" data-t="space.theme"></button>
  <label data-t="spaces.profile"></label>
  <div id="space-profiles" role="radiogroup"></div>
  <p id="space-hint" data-t="space.profileHint"></p>
  <div id="space-actions">
    <button id="space-cancel" data-t="dialog.cancel"></button>
    <button id="space-create" data-t="space.create"></button>
  </div>
</div>

<!-- Sélecteur d'icône (Espace, dossier, onglet) : recherche, teintes de peau, émojis par rubrique. -->
<div id="icons" class="panel" hidden>
  <div id="icons-head">
    <input id="icons-input" spellcheck="false" autocomplete="off" data-t-ph="icons.search">
    <div id="icons-tones" role="radiogroup" data-t-title="icons.tone"></div>
  </div>
  <div id="icons-list"></div>
  <button id="icons-reset" data-t="icons.reset"></button>
</div>

<div id="find" class="panel" hidden>
  <input id="find-input" spellcheck="false" autocomplete="off" data-t-ph="find.placeholder">
  <span id="find-count"></span>
  <button class="fb" id="find-prev"><svg class="i"><use href="#i-up"/></svg></button>
  <button class="fb" id="find-next"><svg class="i"><use href="#i-down"/></svg></button>
  <button class="fb" id="find-close"><svg class="i"><use href="#i-x"/></svg></button>
  <!-- « Rechercher et remplacer » (⌥⌘F) : seconde ligne. -->
  <div id="find-replace" hidden>
    <input id="find-with" spellcheck="false" autocomplete="off" data-t-ph="find.replaceWith">
    <button class="fr" id="find-one" data-t="find.replace"></button>
    <button class="fr" id="find-all" data-t="find.replaceAll"></button>
  </div>
</div>

<div id="peek" hidden>
  <button class="pk" id="peek-close" data-t-title="peek.close"><svg class="i"><use href="#i-x"/></svg></button>
  <button class="pk" id="peek-expand" data-t-title="peek.expand"><svg class="i"><use href="#i-expand"/></svg></button>
  <button class="pk" id="peek-split" data-t-title="peek.split"><svg class="i"><use href="#i-split"/></svg></button>
  <div id="peek-url" hidden></div>
</div>

<div id="drop" hidden><span id="drop-label"></span></div>

<div id="status" hidden></div>

<!-- Balayage de page : la pastille qui suit les doigts (précédent / suivant). -->
<div id="swipe" hidden><div id="swipe-pill"><svg class="i" viewBox="0 0 16 16"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></svg></div></div>

<div id="toast" hidden></div>

<div id="tip" role="tooltip" hidden><span id="tip-text"></span><kbd id="tip-key"></kbd></div>

<script src="common.js"></script>
<script src="theme.js"></script>
<script src="emojis.js"></script>
<script src="overlay.js"></script>
</body>
</html>
