<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Radian</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<!-- Fenêtre des réglages, à volets comme dans Arc. Un volet = une <section class="pane"> ;
     un groupe de réglages = une <div class="card"> ; un réglage = une <div class="line">.
     Une case à cocher ou une liste dont l'id est une clé de réglage (voir FIELDS dans settings.js)
     est enregistrée toute seule. Arc's order: General, Profiles, Links, Shortcuts, Icon, Advanced
     (docs/parity/settings-spec.md). Radian-only controls sit after Arc's, or in a sheet (<dialog class="sheet">)
     opened by a button with data-sheet. data-icon elements get their glyph from ICONS in settings.js. -->
<header id="bar">
  <div id="title"></div>
  <nav id="tabs" role="tablist">
    <button role="tab" data-pane="general"><svg data-icon="gear"></svg><span data-t="pane.general"></span></button>
    <button role="tab" data-pane="profiles"><svg data-icon="person"></svg><span data-t="pane.profiles"></span></button>
    <button role="tab" data-pane="links"><svg data-icon="windows"></svg><span data-t="pane.links"></span></button>
    <button role="tab" data-pane="shortcuts"><svg data-icon="keyboard"></svg><span data-t="pane.shortcuts"></span></button>
    <button role="tab" data-pane="icon"><svg data-icon="appicon"></svg><span data-t="pane.icon"></span></button>
    <button role="tab" data-pane="advanced"><svg data-icon="sliders"></svg><span data-t="pane.advanced"></span></button>
  </nav>
</header>
<main id="panes">

  <!-- ===== General ===== -->
  <section class="pane" id="pane-general" role="tabpanel" hidden>
  <div class="banner" id="default-banner" hidden><span data-t="set.notDefault"></span><button class="btn blue" id="makeDefault"><svg data-icon="heart"></svg><span data-t="set.makeDefault"></span></button></div>
  <div class="card">
    <div class="line"><span class="grow"><span data-t="set.updateCheck"></span><button class="info" data-t-title="set.updateCheckHint"><svg data-icon="info"></svg></button></span><input type="checkbox" id="updateCheck"></div>
    <div class="line"><span class="grow" data-t="set.warnOnQuit"></span><input type="checkbox" id="warnOnQuit"></div>
    <div class="line"><span class="grow" data-t="set.language" data-t-title="set.languageHint"></span>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="nl">Nederlands</option><option value="it">Italiano</option></select></div>
  </div>
  <div class="card">
    <div class="line tall"><span class="grow wrap" data-t="set.perProfile"></span><button class="btn" id="toProfiles" data-t="set.perProfileBtn"></button></div>
  </div>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.appearance"></span>
      <select id="appearance"><option value="auto" data-t="view.auto"></option><option value="light" data-t="view.light"></option><option value="dark" data-t="view.dark"></option></select></div>
    <div class="line"><span class="grow" data-t="set.translucent"></span><input type="checkbox" id="translucent"></div>
  </div>

  <h2 data-t="update.title"></h2>
  <div class="card" id="update-card">
    <div class="line"><div class="grow"><div id="update-version"></div><div class="sub wrap" id="update-state"></div></div><button class="btn" id="update-check" data-t="update.check"></button></div>
    <div id="update-new" hidden>
      <div class="line"><div class="grow"><div id="update-headline"></div><div class="sub wrap" id="update-how" data-t="update.how"></div></div></div>
      <pre id="update-notes" tabindex="0"></pre>
      <div class="line"><span class="grow sub wrap" id="update-dl-state"></span><button class="btn" id="update-cancel" data-t="edit.undo" hidden></button><button class="btn" id="update-reveal" data-t="update.reveal" hidden></button><button class="btn" id="update-download" data-t="update.download"></button><button class="btn blue" id="update-page" data-t="update.page"></button></div>
    </div>
  </div>
  </section>

  <!-- ===== Profiles: list on the left, the selected profile's settings on the right ===== -->
  <section class="pane wide" id="pane-profiles" role="tabpanel" hidden>
  <p class="intro" data-t="set.profilesHint"></p>
  <div class="profiles">
    <div class="plist">
      <div class="plist-head" id="plist-head" data-t="set.yourProfiles"></div>
      <div id="profiles" role="listbox" aria-labelledby="plist-head"></div>
      <div class="plist-bar"><button id="profile-add" data-t-title="set.profileAdd"><svg data-icon="plus"></svg></button><button id="profile-remove"><svg data-icon="minus"></svg></button></div>
    </div>
    <div class="pdetail">
      <input class="pname" id="profile-name" maxlength="40" spellcheck="false">
      <div class="card">
        <div class="line"><span class="grow" data-t="set.search"></span><select id="p-searchEngine"></select></div>
        <div class="line"><span class="grow" data-t="set.manageSearch"></span><button class="btn" data-sheet="sites" data-t="set.searchSettings"></button></div>
        <div class="line"><span class="grow" data-t="set.suggestions"></span><input type="checkbox" id="p-suggestions"></div>
      </div>
      <div class="card">
        <div class="line"><span class="grow" data-t="set.archiveAfter"></span>
          <select id="p-archiveAfterHours">
            <option value="12" data-t="set.h12"></option><option value="24" data-t="set.h24"></option>
            <option value="168" data-t="set.d7"></option><option value="720" data-t="set.d30"></option>
            <option value="0" data-t="set.never"></option>
          </select></div>
        <div class="line"><span class="grow" data-t="set.newDocuments"></span>
          <select id="p-noteApp" data-t-title="set.noteApp"><option value="notes" data-t="set.noteAppNotes"></option><option value="confluence" data-t="set.docConfluence"></option><option value="googleDocs" data-t="set.docGoogle"></option><option value="notion" data-t="set.docNotion"></option><option value="word" data-t="set.docWord"></option></select></div>
        <div class="line"><span class="grow" data-t="set.downloadDir"></span><select id="p-download"></select></div>
      </div>
      <h2 data-t="set.yourData"></h2>
      <div class="card">
        <button class="line go" data-sheet="privacy"><i class="tile blue" data-icon="lock"></i><span class="grow" data-t="set.privacySecurity"></span><svg class="arrow" data-icon="arrow"></svg></button>
        <button class="line go" data-sheet="passwords"><i class="tile green" data-icon="key"></i><span class="grow" data-t="set.passwords"></span><svg class="arrow" data-icon="arrow"></svg></button>
        <button class="line go" id="clearData"><i class="tile red" data-icon="trash"></i><span class="grow" data-t="set.clearDataRow"></span><svg class="arrow" data-icon="arrow"></svg></button>
      </div>
    </div>
  </div>
  </section>

  <!-- ===== Links ===== -->
  <section class="pane" id="pane-links" role="tabpanel" hidden>
  <div class="hero"><svg viewBox="0 0 684 135" preserveAspectRatio="none" aria-hidden="true">
    <path class="hero-bg" d="M0 0H684V118C620 132 560 108 490 116S370 134 300 122 170 106 100 120 30 128 0 120Z"/>
    <rect class="hero-win" x="232" y="20" width="220" height="86" rx="10"/>
    <circle class="hero-dot" cx="246" cy="33" r="3.2"/><circle class="hero-dot" cx="256" cy="33" r="3.2"/><circle class="hero-dot" cx="266" cy="33" r="3.2"/>
    <rect class="hero-pill" x="282" y="27" width="120" height="12" rx="6"/>
    <rect class="hero-line" x="248" y="52" width="150" height="7" rx="3.5"/><rect class="hero-line" x="248" y="66" width="188" height="7" rx="3.5"/><rect class="hero-line" x="248" y="80" width="120" height="7" rx="3.5"/>
  </svg></div>
  <p class="intro" data-t="set.littleIntro"></p>
  <div class="card">
    <div class="line"><span class="grow" id="littleKeysLabel"></span><input type="checkbox" id="littleKeysOn"></div>
    <div class="line"><span class="grow" data-t="set.littleAltClick"></span><input type="checkbox" id="littleAltClick"></div>
    <div class="line"><span class="grow" data-t="set.externalLittleSwitch"></span><input type="checkbox" id="externalLittle"></div>
    <div class="line"><span class="grow" data-t="set.littleArchive" data-t-title="set.littleArchiveHint"></span>
      <select id="littleArchiveHours">
        <option value="1" data-t="set.h1"></option><option value="6" data-t="set.h6"></option><option value="12" data-t="set.h12"></option>
        <option value="24" data-t="set.h24"></option><option value="168" data-t="set.d7"></option><option value="720" data-t="set.d30"></option>
        <option value="0" data-t="set.never"></option>
      </select></div>
  </div>
  <hr>
  <p class="intro" data-t="set.peekIntro"></p>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.peekShift"></span><input type="checkbox" id="peekShift"></div>
    <div class="line"><div class="grow"><div data-t="set.peekLinks"></div><div class="sub wrap note-i" data-t="set.peekLinksHint"></div></div><input type="checkbox" id="peekLinks"></div>
  </div>
  <div class="line plain"><span class="grow" data-t="set.atcRow"></span><button class="btn" data-sheet="atc" data-t="route.atcBtn"></button></div>
  </section>

  <!-- ===== Shortcuts: one alphabetical list on the left ===== -->
  <section class="pane wide" id="pane-shortcuts" role="tabpanel" hidden>
  <div class="banner"><span data-t="keys.basics"></span><button class="btn blue" id="keys-essential"><span class="cmd">⌘</span><span data-t="keys.essential"></span></button></div>
  <div class="keys">
    <div class="keys-left">
      <input class="search" id="keys-search" type="search" spellcheck="false" data-t-ph="keys.search">
      <div id="keys-list" tabindex="-1"></div>
    </div>
    <div class="keys-right">
      <div class="keycaps" aria-hidden="true"><span class="cap">⌘</span><span class="cap"><svg data-icon="smile"></svg></span></div>
      <h3 data-t="keys.custom"></h3>
      <p class="muted" data-t="keys.customText"></p>
      <p class="muted" data-t="keys.hint"></p>
      <div class="card">
        <div class="line"><span class="grow" data-t="set.tabKeysFavorites"></span><input type="checkbox" id="tabKeysFavorites"></div>
        <div class="line"><span class="grow" data-t="set.tabKeysNinthLast" data-t-title="set.tabKeysNinthLastHint"></span><input type="checkbox" id="tabKeysNinthLast"></div>
      </div>
      <div class="keys-foot"><button class="btn" id="keys-reset-all" data-t="keys.resetAll"></button><button class="btn" id="keys-more" data-t-title="keys.more"><svg data-icon="ellipsis"></svg></button></div>
    </div>
  </div>
  </section>

  <!-- ===== Icon: Arc's one-column list of app icons (src/main/app-icon.js) ===== -->
  <section class="pane" id="pane-icon" role="tabpanel" hidden>
  <div class="card" id="appIcons" role="radiogroup"></div>
  <p class="muted note" data-t="set.appIconHint"></p>
  </section>

  <!-- ===== Advanced: Arc's three cards, then Radian's own ===== -->
  <section class="pane" id="pane-advanced" role="tabpanel" hidden>
  <div class="card">
    <div class="line"><i class="tile blue" data-icon="speaker"></i><span class="grow" data-t="set.sounds" data-t-title="set.soundsHint"></span><input type="checkbox" id="sounds"></div>
    <div class="line sub-row"><div class="grow"><div data-t="set.soundGestures"></div><div class="sub wrap" data-t="set.soundGesturesHint"></div></div><input type="checkbox" id="soundGestures"></div>
    <div class="line sub-row"><span class="grow" data-t="set.soundVolume"></span><input type="range" id="soundVolume" min="0" max="100" step="5"></div>
    <div class="line"><i class="tile blue" data-icon="hand"></i><span class="grow" data-t="set.haptics" data-t-title="set.hapticsHint"></span><input type="checkbox" id="haptics"></div>
  </div>
  <div class="card">
    <div class="line"><i class="tile green" data-icon="window"></i><span class="grow" data-t="set.restoreSession" data-t-title="set.restoreSessionHint"></span><input type="checkbox" id="restoreSession"></div>
    <div class="line"><i class="tile red" data-icon="dots"></i><span class="grow" data-t="set.showFullUrl" data-t-title="set.showFullUrlHint"></span><input type="checkbox" id="showFullUrl"></div>
    <div class="line"><i class="tile red" data-icon="doc"></i><div class="grow"><div data-t="set.downloadOpenPdf"></div><div class="sub wrap" data-t="set.downloadOpenPdfHint"></div></div><input type="checkbox" id="downloadOpenPdf"></div>
  </div>
  <div class="card">
    <div class="line"><i class="tile purple" data-icon="play"></i><span class="grow" data-t="set.autoPip" data-t-title="set.autoPipHint"></span><input type="checkbox" id="autoPip"></div>
    <div class="line"><i class="tile purple" data-icon="player"></i><div class="grow"><div data-t="set.mediaControls"></div><div class="sub wrap" data-t="set.mediaControlsHint"></div></div><input type="checkbox" id="mediaControls"></div>
    <div class="line"><i class="tile purple" data-icon="palette"></i><span class="grow" data-t="set.themeData" data-t-title="set.themeDataHint"></span><input type="checkbox" id="themeData"></div>
    <div class="line"><i class="tile purple" data-icon="brush"></i><span class="grow" data-t="set.boostsEnabled" data-t-title="set.boostsEnabledHint"></span><input type="checkbox" id="boostsEnabled"></div>
    <div class="line sub-row"><div class="grow"><div data-t="set.boostsJs"></div><div class="sub wrap" data-t="set.boostsJsHint"></div></div><input type="checkbox" id="boostsJs"></div>
  </div>

  <h2 data-t="set.sleepTitle"></h2>
  <div class="card">
    <div class="line"><i class="tile orange" data-icon="moon"></i><div class="grow"><div data-t="set.sleepAfter"></div><div class="sub wrap" data-t="set.sleepAfterHint"></div></div>
      <select id="sleepAfterHours">
        <option value="1" data-t="set.h1"></option><option value="2" data-t="set.h2"></option><option value="3" data-t="set.h3"></option>
        <option value="6" data-t="set.h6"></option><option value="12" data-t="set.h12"></option><option value="0" data-t="set.never"></option>
      </select></div>
    <div class="line"><i class="tile orange" data-icon="battery"></i><div class="grow"><div data-t="set.batterySaver"></div><div class="sub wrap" data-t="set.batterySaverHint"></div></div><input type="checkbox" id="batterySaver"></div>
    <div class="line"><i class="tile orange" data-icon="chip"></i><div class="grow"><div data-t="set.memoryBudget"></div><div class="sub wrap" data-t="set.memoryBudgetHint"></div></div><select id="memoryBudget"></select></div>
    <div class="line"><i class="tile orange" data-icon="stack"></i><div class="grow"><div data-t="set.memory"></div><div class="sub wrap" data-t="set.memoryHint"></div></div>
      <select id="maxLiveTabs"><option>10</option><option>14</option><option>20</option><option>30</option><option>50</option></select></div>
    <div class="line"><i class="tile orange" data-icon="sun"></i><span class="grow" data-t="set.neverSleepTitle"></span><button class="btn" data-sheet="awake" data-t="set.manage"></button></div>
  </div>

  <h2 data-t="set.devTitle"></h2>
  <div class="card">
    <div class="line"><i class="tile gray" data-icon="code"></i><div class="grow"><div data-t="set.devLocalhost"></div><div class="sub wrap" data-t="set.devLocalhostHint"></div></div><input type="checkbox" id="devLocalhost"></div>
    <div id="dev-list"></div>
    <div class="line"><input class="search" id="dev-host" spellcheck="false" data-t-ph="set.devPlaceholder"><button class="btn" id="dev-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note"><span data-t="set.devHint"></span> <kbd data-key="toggleDevMode"></kbd></p>
  <div class="buttons"><button class="btn" data-sheet="extensions" data-t="ext.manage"></button><button class="btn" data-sheet="import" data-t="set.importBtn"></button></div>
  </section>

</main>

<!-- ===== Sheets ===== -->
<dialog class="sheet" id="sheet-sites" aria-labelledby="sites-title">
  <h1 id="sites-title" data-t="siteSearch.title"></h1>
  <div class="card">
    <div id="site-list"></div>
    <div class="line site-row"><input class="search s-name" id="site-name" maxlength="40" spellcheck="false" data-t-ph="siteSearch.name"><input class="search s-keyword" id="site-keyword" maxlength="30" spellcheck="false" data-t-ph="siteSearch.keyword"><input class="search s-url" id="site-url" maxlength="500" spellcheck="false" data-t-ph="siteSearch.url"><button class="btn" id="site-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note bad" id="site-msg" data-t="siteSearch.bad" hidden></p>
  <p class="muted note" data-t="siteSearch.hint"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet" id="sheet-privacy" aria-labelledby="privacy-title">
  <h1 id="privacy-title" data-t="set.privacySecurity"></h1>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.adblock"></div><div class="sub wrap" data-t="set.adblockHint"></div></div><input type="checkbox" id="adblock"></div>
    <div class="line"><div class="grow"><div data-t="set.cookieBanners"></div><div class="sub wrap" data-t="set.cookieBannersHint"></div></div><input type="checkbox" id="cookieBanners"></div>
    <div class="line"><span class="grow" data-t="set.sitePerms"></span><button class="btn" id="resetPerms" data-t-title="set.sitePerms">↺</button></div>
  </div>
  <h2 data-t="set.allowTitle"></h2>
  <div class="card" id="allow-list"></div>
  <p class="muted note" data-t="set.allProfiles"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet" id="sheet-passwords" aria-labelledby="passwords-title">
  <h1 id="passwords-title" data-t="set.passwords"></h1>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.passwordSave"></div><div class="sub wrap" data-t="set.passwordSaveHint"></div></div><input type="checkbox" id="passwordSave"></div>
    <div class="line"><div class="grow"><div data-t="set.passwordFill"></div><div class="sub wrap" data-t="set.passwordFillHint"></div></div><input type="checkbox" id="passwordFill"></div>
    <div class="line"><span class="grow" data-t="set.passwordManage"></span><button class="btn" id="passwordManage" data-t="set.passwordManageBtn"></button></div>
  </div>
  <p class="muted note" data-t="set.allProfiles"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet wide" id="sheet-atc" aria-labelledby="atc-title">
  <h1 id="atc-title" data-t="route.atc"></h1>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="route.default"></div><div class="sub" data-t="set.linksFromApps"></div></div>
      <select id="externalLinks" data-t-title="set.external"><option value="window" data-t="set.externalWindow"></option><option value="little" data-t="set.externalLittle"></option></select></div>
  </div>
  <div class="card">
    <div id="routes"></div>
    <div class="line"><select id="route-kind" data-t-title="route.kind"><option value="" data-t="route.kindSite"></option><option value="contains" data-t="route.kindContains"></option><option value="equals" data-t="route.kindEquals"></option></select><input class="search" id="route-match" spellcheck="false" data-t-ph="route.placeholder"><select id="route-to"></select><button class="btn" id="route-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note bad" id="route-msg" data-t="route.bad" hidden></p>
  <p class="muted note" data-t="route.hint"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet" id="sheet-awake" aria-labelledby="awake-title">
  <h1 id="awake-title" data-t="set.neverSleepTitle"></h1>
  <div class="card">
    <div id="never-sleep-list"></div>
    <div class="line"><input class="search" id="never-sleep-site" spellcheck="false" data-t-ph="set.neverSleepPlaceholder"><button class="btn" id="never-sleep-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note bad" id="never-sleep-msg" data-t="route.bad" hidden></p>
  <p class="muted note" data-t="set.neverSleepHint"></p>
  <p class="muted note" data-t="set.sleepNote"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet wide" id="sheet-extensions" aria-labelledby="ext-title">
  <h1 id="ext-title" data-t="ext.title"></h1>
  <div class="card">
    <div class="line"><input class="search" id="ext-url" spellcheck="false" data-t-ph="ext.placeholder"><button class="btn" id="ext-add" data-t="ext.install"></button></div>
    <div id="ext-list"></div>
  </div>
  <p class="muted note" id="ext-msg" data-t="ext.hint"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet wide" id="sheet-import" aria-labelledby="import-title">
  <h1 id="import-title" data-t="pane.import"></h1>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="imp.arc"></div><div class="sub wrap" id="import-arc-hint" data-t="imp.arcHint"></div></div><button class="btn" id="import-arc" data-t="imp.btn"></button></div>
    <div class="line"><div class="grow"><div data-t="imp.bookmarks"></div><div class="sub wrap" data-t="imp.bookmarksHint"></div></div><button class="btn" id="import-bookmarks" data-t="imp.btn"></button></div>
    <div class="line"><div class="grow"><div data-t="imp.profile"></div><div class="sub wrap" data-t="imp.profileHint"></div></div><select id="import-profile"></select></div>
    <div class="line"><div class="grow"><div data-t="imp.passwords"></div><div class="sub wrap" data-t="imp.passwordsHint"></div></div><button class="btn" id="import-passwords" data-t="imp.open"></button></div>
  </div>
  <h2 data-t="impb.title"></h2>
  <div class="card" id="import-browsers"></div>
  <p class="muted note" id="import-msg" data-t="imp.scope"></p>
  <p class="muted note" data-t="imp.bookmarksHow"></p>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<dialog class="sheet" id="sheet-extkeys" aria-labelledby="extkeys-title">
  <h1 id="extkeys-title" data-t="keys.extensions"></h1>
  <p class="muted note first" data-t="keys.extensionsHint"></p>
  <div class="card" id="ext-keys-list"></div>
  <div class="sheet-foot"><button class="btn blue" data-close data-t="set.done"></button></div>
</dialog>

<script src="common.js"></script>
<script src="import-ui.js"></script>
<script src="settings.js"></script>
</body>
</html>
