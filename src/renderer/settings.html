<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Orbe</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>
<!-- Fenêtre des réglages, à volets comme dans Arc. Un volet = une <section class="pane"> ;
     un groupe de réglages = un <h2> suivi d'une <div class="card"> ; un réglage = une <div class="line">.
     Une case à cocher ou une liste dont l'id est une clé de réglage (voir FIELDS dans settings.js)
     est enregistrée toute seule. -->
<header id="bar">
  <nav id="tabs" role="tablist">
    <button role="tab" data-pane="general"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2M10 15.4v2M2.6 10h2M15.4 10h2M4.8 4.8l1.4 1.4M13.8 13.8l1.4 1.4M4.8 15.2l1.4-1.4M13.8 6.2l1.4-1.4"/></svg><span data-t="pane.general"></span></button>
    <button role="tab" data-pane="profiles"><svg viewBox="0 0 20 20"><circle cx="10" cy="7.2" r="3.1"/><path d="M3.8 16.6c.9-2.9 3.3-4.3 6.2-4.3s5.3 1.4 6.2 4.3"/></svg><span data-t="pane.profiles"></span></button>
    <button role="tab" data-pane="tabs"><svg viewBox="0 0 20 20"><path d="M15.6 12.2A6.4 6.4 0 0 1 7.8 4.4a6.4 6.4 0 1 0 7.8 7.8z"/></svg><span data-t="pane.tabs"></span></button>
    <button role="tab" data-pane="links"><svg viewBox="0 0 20 20"><path d="M8.6 11.4a3.4 3.4 0 0 0 4.8 0l2.4-2.4a3.4 3.4 0 0 0-4.8-4.8l-.9.9"/><path d="M11.4 8.6a3.4 3.4 0 0 0-4.8 0L4.2 11a3.4 3.4 0 0 0 4.8 4.8l.9-.9"/></svg><span data-t="pane.links"></span></button>
    <button role="tab" data-pane="shortcuts"><svg viewBox="0 0 20 20"><rect x="2.4" y="5" width="15.2" height="10" rx="2.4"/><path d="M5.6 8.2h.1M8.5 8.2h.1M11.4 8.2h.1M14.3 8.2h.1M6.6 11.8h6.8"/></svg><span data-t="pane.shortcuts"></span></button>
    <button role="tab" data-pane="appearance"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2"/><path d="M10 2.8v14.4"/><path d="M10 5.4a4.6 4.6 0 0 1 0 9.2" fill="currentColor" stroke="none"/></svg><span data-t="pane.appearance"></span></button>
    <button role="tab" data-pane="privacy"><svg viewBox="0 0 20 20"><path d="M10 2.6 4 4.9v4.5c0 3.7 2.4 6.6 6 8 3.6-1.4 6-4.3 6-8V4.9z"/><path d="m7.6 10 1.7 1.7 3.2-3.4"/></svg><span data-t="pane.privacy"></span></button>
    <button role="tab" data-pane="extensions"><svg viewBox="0 0 20 20"><path d="M8 4.2a1.8 1.8 0 1 1 3.6 0v1h3.2v3.4h-1a1.8 1.8 0 1 0 0 3.6h1v3.6H4.4V5.2H8z"/></svg><span data-t="pane.extensions"></span></button>
    <button role="tab" data-pane="import"><svg viewBox="0 0 20 20"><path d="M10 3v9.4M6.4 9 10 12.6 13.6 9"/><path d="M3.6 13.4v1.8c0 .9.7 1.6 1.6 1.6h9.6c.9 0 1.6-.7 1.6-1.6v-1.800"/></svg><span data-t="pane.import"></span></button>
    <button role="tab" data-pane="advanced"><svg viewBox="0 0 20 20"><path d="M3 6h7.4M14.6 6H17M3 14h2.4M9.6 14H17"/><circle cx="12.5" cy="6" r="2.1"/><circle cx="7.5" cy="14" r="2.1"/></svg><span data-t="pane.advanced"></span></button>
  </nav>
</header>
<main id="panes">

  <!-- ===== Général ===== -->
  <section class="pane" id="pane-general" role="tabpanel" hidden>
  <h2 data-t="set.general"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.language"></div><div class="sub" data-t="set.languageHint"></div></div>
      <select id="lang"><option value="fr">Français</option><option value="en">English</option></select></div>
    <div class="line"><div class="grow"><div data-t="set.default"></div><div class="sub" id="defaultState"></div></div><button class="btn" id="makeDefault" data-t="set.makeDefault"></button></div>
  </div>

  <h2 data-t="set.startup"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.restoreSession"></div><div class="sub" data-t="set.restoreSessionHint"></div></div><input type="checkbox" id="restoreSession"></div>
    <div class="line"><span class="grow" data-t="set.warnOnQuit"></span><input type="checkbox" id="warnOnQuit"></div>
  </div>

  <h2 data-t="set.searchTabs"></h2>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.search"></span><select id="searchEngine"></select></div>
    <div class="line"><span class="grow" data-t="set.suggestions"></span><input type="checkbox" id="suggestions"></div>
    <div class="line"><span class="grow" data-t="set.archiveAfter"></span>
      <select id="archiveAfterHours">
        <option value="12" data-t="set.h12"></option><option value="24" data-t="set.h24"></option>
        <option value="168" data-t="set.d7"></option><option value="720" data-t="set.d30"></option>
        <option value="0" data-t="set.never"></option>
      </select></div>
    <div class="line"><span class="grow sub" data-t="set.perProfile"></span><button class="btn" id="toProfiles" data-t="set.perProfileBtn"></button></div>
  </div>

  <h2 data-t="set.downloads"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.downloadDir"></div><div class="sub path" id="downloadDirPath"></div></div>
      <button class="btn" id="downloadDirReset" data-t="set.useDefault"></button><button class="btn" id="downloadDirChoose" data-t="set.choose"></button></div>
    <div class="line"><span class="grow" data-t="set.downloadAsk"></span><input type="checkbox" id="downloadAsk"></div>
    <div class="line"><div class="grow"><div data-t="set.downloadOpenPdf"></div><div class="sub" data-t="set.downloadOpenPdfHint"></div></div><input type="checkbox" id="downloadOpenPdf"></div>
  </div>

  <p class="muted foot"><span data-t="set.about"></span> <span id="version"></span></p>
  </section>

  <!-- ===== Profils ===== -->
  <section class="pane" id="pane-profiles" role="tabpanel" hidden>
  <h2 data-t="set.profiles"></h2>
  <div id="profiles"></div>
  <p class="muted note" data-t="set.profilesHint"></p>
  <p class="muted note" data-t="set.profilesHint2"></p>
  </section>

  <!-- ===== Onglets : veille automatique ===== -->
  <section class="pane" id="pane-tabs" role="tabpanel" hidden>
  <h2 data-t="set.sleepTitle"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.sleepAfter"></div><div class="sub wrap" data-t="set.sleepAfterHint"></div></div>
      <select id="sleepAfterHours">
        <option value="1" data-t="set.h1"></option><option value="2" data-t="set.h2"></option><option value="3" data-t="set.h3"></option>
        <option value="6" data-t="set.h6"></option><option value="12" data-t="set.h12"></option><option value="0" data-t="set.never"></option>
      </select></div>
    <div class="line"><div class="grow"><div data-t="set.batterySaver"></div><div class="sub wrap" data-t="set.batterySaverHint"></div></div><input type="checkbox" id="batterySaver"></div>
    <div class="line"><div class="grow"><div data-t="set.memoryBudget"></div><div class="sub wrap" data-t="set.memoryBudgetHint"></div></div>
      <select id="memoryBudget"></select></div>
    <div class="line"><div class="grow"><div data-t="set.memory"></div><div class="sub" data-t="set.memoryHint"></div></div>
      <select id="maxLiveTabs"><option>10</option><option>14</option><option>20</option><option>30</option><option>50</option></select></div>
  </div>
  <p class="muted note" data-t="set.sleepNote"></p>

  <h2 data-t="set.neverSleepTitle"></h2>
  <div class="card">
    <div id="never-sleep-list"></div>
    <div class="line"><input class="search" id="never-sleep-site" style="margin:0" spellcheck="false" data-t-ph="set.neverSleepPlaceholder"><button class="btn primary" id="never-sleep-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note" id="never-sleep-msg" style="color:#e11d48" data-t="route.bad" hidden></p>
  <p class="muted note" data-t="set.neverSleepHint"></p>
  </section>

  <!-- ===== Liens ===== -->
  <section class="pane" id="pane-links" role="tabpanel" hidden>
  <h2 data-t="set.linksFromApps"></h2>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.external"></span>
      <select id="externalLinks"><option value="window" data-t="set.externalWindow"></option><option value="little" data-t="set.externalLittle"></option></select></div>
  </div>

  <h2 data-t="route.title"></h2>
  <div class="card">
    <div id="routes"></div>
    <div class="line"><input class="search" id="route-match" style="margin:0" spellcheck="false" data-t-ph="route.placeholder"><select id="route-to"></select><button class="btn primary" id="route-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note" id="route-msg" style="color:#e11d48" data-t="route.bad" hidden></p>
  <p class="muted note" data-t="route.hint"></p>

  <h2 data-t="set.linksInPages"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.peekLinks"></div><div class="sub" data-t="set.peekLinksHint"></div></div><input type="checkbox" id="peekLinks"></div>
    <div class="line"><div class="grow"><div data-t="set.peekShift"></div><div class="sub" data-t="set.peekShiftHint"></div></div><input type="checkbox" id="peekShift"></div>
    <div class="line"><span class="grow" data-t="set.littleAltClick"></span><input type="checkbox" id="littleAltClick"></div>
  </div>

  <h2 data-t="set.little"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.littleGlobal"></div><div class="sub" data-t="set.littleGlobalHint"></div></div>
      <kbd id="littleKeys"></kbd><button class="btn" id="littleKeysEdit" data-t="set.edit"></button></div>
    <div class="line"><div class="grow"><div data-t="set.littleArchive"></div><div class="sub" data-t="set.littleArchiveHint"></div></div>
      <select id="littleArchiveHours">
        <option value="12" data-t="set.h12"></option><option value="24" data-t="set.h24"></option>
        <option value="168" data-t="set.d7"></option><option value="720" data-t="set.d30"></option>
        <option value="0" data-t="set.never"></option>
      </select></div>
  </div>
  </section>

  <!-- ===== Raccourcis ===== -->
  <section class="pane" id="pane-shortcuts" role="tabpanel" hidden>
  <div class="keys-top">
    <input class="search" id="keys-search" type="search" spellcheck="false" data-t-ph="keys.search">
    <button class="btn" id="keys-reset-all" data-t="keys.resetAll"></button>
  </div>
  <p class="muted note first" data-t="keys.hint"></p>
  <div id="keys-list" tabindex="-1"></div>

  <h2 data-t="keys.tabNumbers"></h2>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.tabKeysFavorites"></span><input type="checkbox" id="tabKeysFavorites"></div>
    <div class="line"><div class="grow"><div data-t="set.tabKeysNinthLast"></div><div class="sub" data-t="set.tabKeysNinthLastHint"></div></div><input type="checkbox" id="tabKeysNinthLast"></div>
  </div>
  <p class="foot"><button class="btn" id="keys-essential" data-t="keys.essential"></button></p>
  </section>

  <!-- ===== Apparence ===== -->
  <section class="pane" id="pane-appearance" role="tabpanel" hidden>
  <h2 data-t="set.theme"></h2>
  <div class="card">
    <div class="line"><span class="grow" data-t="set.appearance"></span>
      <select id="appearance"><option value="auto" data-t="view.auto"></option><option value="light" data-t="view.light"></option><option value="dark" data-t="view.dark"></option></select></div>
    <div class="line"><span class="grow" data-t="set.translucent"></span><input type="checkbox" id="translucent"></div>
  </div>
  <p class="muted note" data-t="set.spaceThemeHint"></p>

  <h2 data-t="set.toolbar"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.showToolbar"></div><div class="sub" data-t="set.showToolbarHint"></div></div><input type="checkbox" id="showToolbar"></div>
    <div class="line"><div class="grow"><div data-t="set.showFullUrl"></div><div class="sub" data-t="set.showFullUrlHint"></div></div><input type="checkbox" id="showFullUrl"></div>
  </div>
  </section>

  <!-- ===== Confidentialité ===== -->
  <section class="pane" id="pane-privacy" role="tabpanel" hidden>
  <h2 data-t="set.blocking"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.adblock"></div><div class="sub" data-t="set.adblockHint"></div></div><input type="checkbox" id="adblock"></div>
    <div class="line"><div class="grow"><div data-t="set.cookieBanners"></div><div class="sub" data-t="set.cookieBannersHint"></div></div><input type="checkbox" id="cookieBanners"></div>
    <div class="line"><div class="grow"><div data-t="set.themeData"></div><div class="sub" data-t="set.themeDataHint"></div></div><input type="checkbox" id="themeData"></div>
    <div class="line"><div class="grow"><div data-t="set.boostsJs"></div><div class="sub" data-t="set.boostsJsHint"></div></div><input type="checkbox" id="boostsJs"></div>
  </div>

  <h2 data-t="set.allowTitle"></h2>
  <div class="card" id="allow-list"></div>

  <h2 data-t="set.passwords"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.passwordSave"></div><div class="sub" data-t="set.passwordSaveHint"></div></div><input type="checkbox" id="passwordSave"></div>
    <div class="line"><div class="grow"><div data-t="set.passwordFill"></div><div class="sub" data-t="set.passwordFillHint"></div></div><input type="checkbox" id="passwordFill"></div>
    <div class="line"><span class="grow" data-t="set.passwordManage"></span><button class="btn" id="passwordManage" data-t="set.passwordManageBtn"></button></div>
  </div>

  <h2 data-t="set.data"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.clearData"></div><div class="sub" data-t="set.clearDataHint"></div></div>
      <button class="btn" id="clearData" data-t="set.clearBtn"></button></div>
    <div class="line"><span class="grow" data-t="set.sitePerms"></span><button class="btn" id="resetPerms">↺</button></div>
  </div>
  </section>

  <!-- ===== Extensions ===== -->
  <section class="pane" id="pane-extensions" role="tabpanel" hidden>
  <h2 data-t="ext.title"></h2>
  <div class="card">
    <div class="line"><input class="search" id="ext-url" style="margin:0" spellcheck="false" data-t-ph="ext.placeholder"><button class="btn primary" id="ext-add" data-t="ext.install"></button></div>
    <div id="ext-list"></div>
  </div>
  <p class="muted note" id="ext-msg" data-t="ext.hint"></p>
  </section>

  <!-- ===== Import ===== -->
  <section class="pane" id="pane-import" role="tabpanel" hidden>
  <h2 data-t="pane.import"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="imp.arc"></div><div class="sub wrap" id="import-arc-hint" data-t="imp.arcHint"></div></div><button class="btn" id="import-arc" data-t="imp.btn"></button></div>
    <div class="line"><div class="grow"><div data-t="imp.bookmarks"></div><div class="sub wrap" data-t="imp.bookmarksHint"></div></div><button class="btn" id="import-bookmarks" data-t="imp.btn"></button></div>
    <div class="line"><div class="grow"><div data-t="imp.profile"></div><div class="sub wrap" data-t="imp.profileHint"></div></div><select id="import-profile"></select></div>
    <div class="line"><div class="grow"><div data-t="imp.passwords"></div><div class="sub wrap" data-t="imp.passwordsHint"></div></div><button class="btn" id="import-passwords" data-t="imp.open"></button></div>
  </div>
  <h2 data-t="impb.title"></h2>
  <div class="card" id="import-browsers"></div>
  <p class="muted note" id="import-msg" data-t="imp.scope"></p>
  <p class="muted note" data-t="imp.bookmarksHow"></p>
  </section>

  <!-- ===== Avancé ===== -->
  <section class="pane" id="pane-advanced" role="tabpanel" hidden>
  <h2 data-t="update.title"></h2>
  <div class="card" id="update-card">
    <div class="line"><div class="grow"><div id="update-version"></div><div class="sub wrap" id="update-state"></div></div><button class="btn" id="update-check" data-t="update.check"></button></div>
    <div id="update-new" hidden>
      <div class="line"><div class="grow"><div id="update-headline"></div><div class="sub wrap" id="update-how" data-t="update.how"></div></div></div>
      <pre id="update-notes" tabindex="0"></pre>
      <div class="line"><span class="grow sub wrap" id="update-dl-state"></span><button class="btn" id="update-cancel" data-t="edit.undo" hidden></button><button class="btn" id="update-reveal" data-t="update.reveal" hidden></button><button class="btn" id="update-download" data-t="update.download"></button><button class="btn primary" id="update-page" data-t="update.page"></button></div>
    </div>
    <div class="line"><div class="grow"><div data-t="set.updateCheck"></div><div class="sub wrap" data-t="set.updateCheckHint"></div></div><input type="checkbox" id="updateCheck"></div>
  </div>

  <h2 data-t="set.mediaTitle"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.autoPip"></div><div class="sub" data-t="set.autoPipHint"></div></div><input type="checkbox" id="autoPip"></div>
    <div class="line"><div class="grow"><div data-t="set.mediaControls"></div><div class="sub" data-t="set.mediaControlsHint"></div></div><input type="checkbox" id="mediaControls"></div>
    <div class="line"><div class="grow"><div data-t="set.sounds"></div><div class="sub" data-t="set.soundsHint"></div></div><input type="checkbox" id="sounds"></div>
    <div class="line"><div class="grow"><div data-t="set.soundGestures"></div><div class="sub" data-t="set.soundGesturesHint"></div></div><input type="checkbox" id="soundGestures"></div>
    <div class="line"><span class="grow" data-t="set.soundVolume"></span><input type="range" id="soundVolume" min="0" max="100" step="5"></div>
  </div>

  <h2 data-t="set.sites"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.boostsEnabled"></div><div class="sub" data-t="set.boostsEnabledHint"></div></div><input type="checkbox" id="boostsEnabled"></div>
  </div>

  <h2 data-t="set.devTitle"></h2>
  <div class="card">
    <div class="line"><div class="grow"><div data-t="set.devLocalhost"></div><div class="sub wrap" data-t="set.devLocalhostHint"></div></div><input type="checkbox" id="devLocalhost"></div>
    <div id="dev-list"></div>
    <div class="line"><input class="search" id="dev-host" style="margin:0" spellcheck="false" data-t-ph="set.devPlaceholder"><button class="btn primary" id="dev-add" data-t="route.add"></button></div>
  </div>
  <p class="muted note"><span data-t="set.devHint"></span> <kbd data-key="toggleDevMode"></kbd></p>
  </section>

</main>
<script src="common.js"></script>
<script src="import-ui.js"></script>
<script src="settings.js"></script>
</body>
</html>
